{id:'bsp-01',num:'01',title:'What is a BSP?',hours:6,phase:0,topics:['BSP scope','Platform','SDK','Vendor'],content:`## 🎯 Goal\nUnderstand what a Board Support Package is, its boundaries, and its role in the product development chain from silicon vendor to consumer.\n\n## 🧠 BSP — The Bridge Layer\n\n\`\`\`mermaid\nflowchart TD\n    HW[Hardware / SoC] --> BSP[Board Support Package]\n    BSP --> Boot[Bootloader<br/>U-Boot, TF-A]\n    BSP --> Kernel[Kernel + Drivers]\n    BSP --> DT[Device Tree]\n    BSP --> HAL[HAL / Firmware]\n    BSP --> Build[Build System<br/>Yocto, Buildroot]\n    BSP --> OS[Operating System<br/>Linux, Android, RTOS]\n    OS --> APP[Applications]\n\`\`\`\n\nA BSP is everything needed to boot an operating system on a specific board. The silicon vendor provides a reference BSP; the OEM customizes it for their product.\n\n**BSP vs SDK vs Firmware:**\n- **BSP:** Board-specific code — bootloader config, device tree, kernel drivers, HAL\n- **SDK:** Development tools + libraries for building applications on top of the BSP\n- **Firmware:** Low-level code running on embedded processors (modem firmware, sensor hub firmware)\n\n## ⌨️ Do This\n\n1. Browse a real BSP repository — look at the Raspberry Pi kernel repo (github.com/raspberrypi/linux) or TI's Processor SDK\n2. List every component you can identify: bootloader configs, device tree files, kernel patches, build scripts\n3. Find the board-specific files vs the generic kernel code — notice how small the BSP delta actually is\n4. Read the release notes of any vendor BSP — observe what changed between versions\n\n## ⚠️ Gotcha\n\n**"BSP" means different things to different vendors.** Some vendors ship a BSP as a tarball of patches on top of mainline Linux. Others ship an entire forked kernel with proprietary drivers baked in. The latter is harder to maintain and upgrade. Always check how far the vendor BSP has diverged from mainline — a BSP with 500 patches on kernel 5.4 when mainline is at 6.x is a maintenance burden.\n\n**Don't confuse BSP with SDK.** An SDK might include a BSP, but it also includes application-level libraries, toolchains, and documentation. When someone says "install the SDK," you're getting more than just board support.\n\n## 🛠️ Mini-Project\n\nCreate a BSP inventory document for any development board you have access to (Raspberry Pi, BeagleBone, or even a virtual QEMU target):\n- List every BSP component: bootloader, kernel version, device tree files, out-of-tree drivers\n- Document the build instructions (how to compile the kernel, how to flash)\n- Note which components are upstream vs vendor-specific\n- Identify one component you'd want to upstream and explain why\n\n## ✅ You've mastered this when…\n- You can define BSP scope and boundaries\n- You understand the vendor → OEM → consumer chain\n- You know the difference between BSP, SDK, and firmware\n- You can list the major components of a typical Linux BSP`},

{id:'bsp-02',num:'02',title:'Boot Sequence',hours:12,phase:0,topics:['U-Boot','TF-A','Secure boot','AVB','ROM code'],content:`## 🎯 Goal\nTrace the complete boot sequence from power-on to userspace. Understand each stage, secure boot, and the chain of trust.\n\n## 🧠 The Boot Chain\n\n\`\`\`mermaid\nflowchart TD\n    POR[Power-On Reset] --> ROM[Boot ROM<br/>Hardcoded in silicon]\n    ROM --> SPL[SPL / MLO<br/>First-stage bootloader]\n    SPL --> TFA[ARM Trusted Firmware<br/>TF-A / BL31]\n    TFA --> UBOOT[U-Boot<br/>Second-stage bootloader]\n    UBOOT --> KERN[Linux Kernel]\n    KERN --> INIT[Init System<br/>systemd / SysVinit]\n    INIT --> USER[Userspace<br/>Applications]\n\`\`\`\n\nEach stage is responsible for initializing enough hardware to load the next stage. ROM code initializes the minimum (clock, memory controller), loads SPL from storage. SPL initializes DRAM, loads U-Boot. U-Boot has a full environment — network, storage, display — and loads the kernel.\n\n## 🧠 Secure Boot — Chain of Trust\n\nEach stage cryptographically verifies the next before executing it:\n\n\`\`\`mermaid\nflowchart LR\n    ROM[ROM<br/>Root of trust<br/>Has public key] -->|verifies| SPL\n    SPL -->|verifies| TFA[TF-A]\n    TFA -->|verifies| UBOOT[U-Boot]\n    UBOOT -->|verifies| KERN[Kernel]\n    KERN -->|dm-verity| FS[Filesystem]\n\`\`\`\n\nIf any stage fails verification, boot halts. This prevents running tampered or malicious code.\n\n## ⌨️ Do This\n1. Read U-Boot documentation: understand environment variables, boot commands\n2. On a Linux machine, run \`dmesg | head -100\` — observe the kernel's early boot messages\n3. Check if your system uses UEFI or legacy BIOS: \`ls /sys/firmware/efi\`\n\n## ⚠️ Gotcha\n\n**Secure boot can permanently brick a board.** Once you burn OTP (One-Time Programmable) fuses with your secure boot keys, there's no going back. If you lose the private key, the board will refuse to boot anything. Always test with development keys on non-production hardware first.\n\n**Boot time matters more than you think.** Automotive systems need to show a rear-view camera within 2 seconds of ignition. Consumer devices with 30-second boot times frustrate users. Measure boot time from the start — optimizing it later means touching every stage of the chain.\n\n## 🛠️ Mini-Project\n\nTrace and document the boot sequence of your own machine:\n1. Run \`dmesg | head -200\` and annotate each phase (kernel decompression, device init, driver probing)\n2. Measure boot time: \`systemd-analyze\` (if systemd) or timestamp the dmesg output\n3. Identify the top 5 slowest steps using \`systemd-analyze blame\`\n4. Draw a timeline diagram showing each boot stage and its duration\n5. Propose one optimization that could shave time off the boot\n\n## ✅ You've mastered this when…\n- You can trace every stage from power-on to userspace\n- You understand what each bootloader stage initializes\n- You can explain secure boot and the chain of trust\n- You know what dm-verity and AVB (Android Verified Boot) do`},

{id:'bsp-03',num:'03',title:'Linux Kernel Fundamentals',hours:12,phase:0,topics:['Kernel','Syscalls','Modules','procfs','sysfs'],content:`## 🎯 Goal\nUnderstand the Linux kernel architecture — monolithic with modules, the kernel/userspace boundary, syscalls, and the kernel build system.\n\n## 🧠 Kernel Architecture\n\n\`\`\`mermaid\nflowchart TD\n    subgraph "Userspace"\n        APP[Applications]\n        LIB[C Library / glibc]\n    end\n    subgraph "Kernel Space"\n        SC[System Call Interface]\n        PM[Process Mgmt] \n        MM[Memory Mgmt]\n        VFS[Virtual Filesystem]\n        NET[Network Stack]\n        DD[Device Drivers]\n    end\n    subgraph "Hardware"\n        CPU[CPU] \n        RAM[Memory]\n        DEV[Devices]\n    end\n    APP --> LIB --> SC\n    SC --> PM & MM & VFS & NET & DD\n    DD --> DEV\n    MM --> RAM\n    PM --> CPU\n\`\`\`\n\nThe kernel is the privileged layer between applications and hardware. Applications can only access hardware through system calls (open, read, write, ioctl, mmap, etc.).\n\n**procfs (/proc):** Virtual filesystem exposing kernel and process information. \`/proc/cpuinfo\`, \`/proc/meminfo\`, \`/proc/[pid]/status\`.\n\n**sysfs (/sys):** Virtual filesystem exposing device and driver information. Structured by bus, class, and device.\n\n## ⌨️ Do This\n\n1. Check your running kernel version: \`uname -r\`\n2. List loaded kernel modules: \`lsmod\` — pick one and run \`modinfo <module>\` to see its metadata\n3. Explore procfs: \`cat /proc/cpuinfo\`, \`cat /proc/meminfo\`, \`cat /proc/interrupts\`\n4. Explore sysfs: \`ls /sys/class/net/\` to see network interfaces, \`ls /sys/block/\` for storage devices\n5. Try loading and unloading a module: \`sudo modprobe <module>\` and \`sudo modprobe -r <module>\`\n\n## ⚠️ Gotcha\n\n**A kernel bug crashes the entire system.** Unlike userspace where a segfault kills one process, a bug in kernel code causes a kernel panic — the whole system goes down. This is why kernel development demands extra discipline: no memory leaks (the kernel doesn't have garbage collection), no sleeping while holding spinlocks, and rigorous error handling on every code path.\n\n**Kernel API is not stable.** Unlike userspace APIs (POSIX, syscalls), internal kernel APIs change between versions with no backward compatibility. A driver that compiles on 5.15 might not compile on 6.1. This is by design — it forces drivers to stay in-tree where they get updated alongside API changes.\n\n## 🛠️ Mini-Project\n\nWrite a "hello world" kernel module:\n1. Create a C file with \`module_init()\` and \`module_exit()\` functions\n2. Use \`printk(KERN_INFO "Hello from kernel!\\n")\` to log messages\n3. Write a Makefile that builds against your running kernel headers\n4. Load it with \`insmod\`, check \`dmesg\` for your message, unload with \`rmmod\`\n5. Add a module parameter (\`module_param()\`) that accepts a name string and prints "Hello, <name>!"\n\nIf you don't have a Linux machine, use a VM or WSL2.\n\n## ✅ You've mastered this when…\n- You understand the kernel/userspace boundary and why it exists\n- You can navigate procfs and sysfs to find system information\n- You know how to build a kernel from source (make menuconfig, make)\n- You understand kernel modules vs built-in drivers`},

{id:'bsp-04',num:'04',title:'Device Trees',hours:10,phase:0,topics:['DTS','DTB','Overlays','Bindings'],content:`## 🎯 Goal\nRead, write, and debug device trees — the data structure that tells the kernel what hardware is present and how it's connected.\n\n## 🧠 What Problem Device Trees Solve\n\nWithout device trees, hardware descriptions were hardcoded in board files inside the kernel source. Every new board required kernel modifications. Device trees externalize this: the hardware description is a separate data file.\n\n\`\`\`mermaid\nflowchart LR\n    DTS[.dts source file] -->|dtc compiler| DTB[.dtb binary blob]\n    DTB -->|loaded by bootloader| KERN[Linux Kernel]\n    KERN -->|matches drivers| DRV[Device Drivers]\n\`\`\`\n\n**Device tree syntax:**\n\`\`\`dts\n/ {\n    model = "My Custom Board";\n    compatible = "vendor,my-board";\n\n    memory@80000000 {\n        device_type = "memory";\n        reg = <0x80000000 0x40000000>; /* 1GB at 0x80000000 */\n    };\n\n    i2c@40012000 {\n        compatible = "vendor,i2c-controller";\n        reg = <0x40012000 0x400>;\n        #address-cells = <1>;\n        #size-cells = <0>;\n\n        temperature-sensor@48 {\n            compatible = "ti,tmp102";\n            reg = <0x48>;\n        };\n    };\n};\n\`\`\`\n\n**Device tree overlays** allow modifying the base device tree without replacing it — used for add-on boards, optional features, and runtime configuration.\n\n## ⌨️ Do This\n\n1. Decompile your system's device tree (if Linux): \`dtc -I dtb -O dts /sys/firmware/fdt > my_board.dts\` or find DTB files in \`/boot/dtbs/\`\n2. Read the device tree bindings documentation in the kernel source: \`Documentation/devicetree/bindings/\`\n3. Find the \`compatible\` string for any device in your DT and search for the matching driver in the kernel source\n4. Practice reading hex addresses: \`reg = <0x40012000 0x400>\` means base address 0x40012000, size 0x400 (1024 bytes)\n\n## ⚠️ Gotcha\n\n**The compatible string must match exactly.** If your device tree says \`compatible = "vendor,sensor-v2"\` but the driver registers \`"vendor,sensor"\`, the driver will never probe. This is the #1 cause of "my driver doesn't load" bugs. Always check the driver's \`of_match_table\`.\n\n**Address and size cells trip everyone up.** \`#address-cells\` and \`#size-cells\` in a parent node define how many 32-bit values make up an address or size in child nodes. Get these wrong and your memory regions will be silently misinterpreted.\n\n## 🛠️ Mini-Project\n\nWrite a device tree overlay for a hypothetical expansion board:\n1. Start with a base device tree for any supported board (Raspberry Pi DTS files are easy to find)\n2. Write an overlay that adds: an I2C temperature sensor at address 0x48, an SPI flash chip, and a GPIO-controlled LED\n3. Include proper \`compatible\` strings, \`reg\` properties, and \`status = "okay"\`\n4. Compile it with \`dtc\` and verify there are no warnings\n5. Document each property you used and why\n\n## ✅ You've mastered this when…\n- You can read a device tree and identify CPUs, memory, and peripherals\n- You can write device tree entries for new hardware\n- You understand device tree bindings (the driver's contract)\n- You can use overlays to modify the base DT`},

{id:'bsp-05',num:'05',title:'Kernel Driver Development',hours:14,phase:1,topics:['char driver','Platform driver','probe','ioctl'],content:`## 🎯 Goal\nWrite a Linux kernel driver — understand the platform driver model, probe/remove lifecycle, and how userspace communicates with drivers.\n\n## 🧠 Driver Types\n\n| Type | Interface | Example |\n|------|-----------|--------|\n| Character | /dev/xxx (read/write bytes) | Serial ports, sensors, GPIO |\n| Block | /dev/sdX (read/write blocks) | Disks, flash storage |\n| Network | Network interface (eth0, wlan0) | Ethernet, WiFi |\n\n## 🧠 Platform Driver Lifecycle\n\n\`\`\`mermaid\nsequenceDiagram\n    participant DT as Device Tree\n    participant BUS as Platform Bus\n    participant DRV as Driver\n    DT->>BUS: Register device (compatible string)\n    DRV->>BUS: Register driver (compatible string)\n    BUS->>DRV: Match! Call probe()\n    Note over DRV: Initialize hardware, register /dev node\n    Note over DRV: ... device in use ...\n    BUS->>DRV: Call remove()\n    Note over DRV: Cleanup, free resources\n\`\`\`\n\nThe kernel matches drivers to devices using the \`compatible\` string from the device tree.\n\n## ⌨️ Do This\n\n1. Read a real kernel driver — start with a simple one like \`drivers/iio/temperature/tmp102.c\` (I2C temperature sensor)\n2. Identify the key structures: \`of_match_table\`, \`probe()\`, \`remove()\`, \`file_operations\`\n3. Trace how the driver registers with the platform bus and matches with the device tree\n4. Look at how the driver exposes data to userspace (sysfs attributes or /dev node)\n\n## ⚠️ Gotcha\n\n**Never sleep in interrupt context.** Functions like \`msleep()\`, \`mutex_lock()\`, or \`kmalloc(GFP_KERNEL)\` can sleep — calling them from an interrupt handler or while holding a spinlock will deadlock or crash. Use \`GFP_ATOMIC\` for allocations in interrupt context, and defer work to a tasklet or workqueue.\n\n**Always check return values.** Every kernel function that can fail returns an error code. Ignoring it means your driver will silently corrupt data or crash. Use \`IS_ERR()\` for pointer-returning functions and always have a cleanup path for partial initialization.\n\n## 🛠️ Mini-Project\n\nWrite a character device driver for a virtual sensor:\n1. Create a platform driver that registers a char device (\`/dev/vsensor\`)\n2. Implement \`read()\` to return a simulated temperature value (use \`get_random_bytes()\` or a counter)\n3. Implement \`ioctl()\` to let userspace configure the sensor (e.g., set update interval)\n4. Add a device tree binding document describing your sensor's expected properties\n5. Write a userspace test program that opens \`/dev/vsensor\`, reads values, and uses ioctl to change settings\n\n## ✅ You've mastered this when…\n- You can write a basic platform driver with probe/remove\n- You understand file_operations (open, read, write, ioctl)\n- You can create a /dev entry for userspace access\n- You know how the kernel matches drivers to device tree entries`},

{id:'bsp-06',num:'06',title:'Build Systems & Toolchains',hours:12,phase:1,topics:['Cross-compile','Yocto','Buildroot','Kconfig'],content:`## 🎯 Goal\nCross-compile a Linux kernel, build a complete root filesystem, and understand when to use Yocto vs Buildroot.\n\n## 🧠 Build System Comparison\n\n| | Yocto/OpenEmbedded | Buildroot |\n|---|-------------------|----------|\n| Complexity | High (steep learning curve) | Lower |\n| Flexibility | Very high (layers, recipes) | Moderate |\n| Package management | opkg/rpm/deb | None (static image) |\n| Build time | Hours (first build) | Faster |\n| Use case | Production products | Prototyping, simple products |\n\nYocto uses a layer-based architecture where each layer adds packages, patches, or configurations. The meta-data is organized into recipes (.bb files) and configuration (.conf files).\n\n## ⌨️ Do This\n\n1. Install a cross-compilation toolchain: \`sudo apt install gcc-aarch64-linux-gnu\`\n2. Cross-compile a "hello world" C program: \`aarch64-linux-gnu-gcc -o hello hello.c\`\n3. Verify the binary: \`file hello\` should show "ARM aarch64" not your host architecture\n4. Download Buildroot, run \`make qemu_aarch64_virt_defconfig && make\` — observe the entire build process\n5. If you have time, boot the resulting image in QEMU\n\n## ⚠️ Gotcha\n\n**Toolchain mismatch silently breaks things.** If your kernel is built with GCC 12 and your rootfs libraries are built with GCC 10, you might get subtle runtime failures — different ABIs, different default flags, different library versions. Always use the same toolchain for everything in a BSP.\n\n**Yocto's first build takes hours.** It downloads and compiles everything from source. Don't cancel it midway — the partial state is hard to recover from. Use \`SSTATE_MIRRORS\` and \`DL_DIR\` caching to speed up subsequent builds. Buildroot is a better starting point for learning.\n\n## 🛠️ Mini-Project\n\nBuild a minimal Linux system with Buildroot:\n1. Clone Buildroot and configure for QEMU ARM64: \`make qemu_aarch64_virt_defconfig\`\n2. Add packages: \`make menuconfig\` → add dropbear (SSH), nano (editor), and htop\n3. Build the full image: \`make -j$(nproc)\`\n4. Boot in QEMU and SSH into your custom Linux system\n5. Document: total image size, boot time, and what's running (\`ps aux\`)\n\n## ✅ You've mastered this when…\n- You can cross-compile a kernel for an ARM target\n- You can build a root filesystem with Buildroot\n- You understand Yocto's layer architecture\n- You know how Kconfig and defconfig work`},

{id:'bsp-07',num:'07',title:'Root Filesystem & Init',hours:10,phase:1,topics:['initramfs','systemd','BusyBox','OTA','A/B partition'],content:`## 🎯 Goal\nBuild and customize root filesystems, understand init systems, and implement OTA update strategies.\n\n## 🧠 From Kernel to Userspace\n\n\`\`\`mermaid\nflowchart LR\n    K[Kernel] --> IR{initramfs?}\n    IR -->|yes| IFS[initramfs<br/>Mount real rootfs]\n    IR -->|no| RFS[Root Filesystem<br/>directly]\n    IFS --> RFS\n    RFS --> INIT[Init System<br/>PID 1]\n    INIT --> S1[Service 1]\n    INIT --> S2[Service 2]\n    INIT --> S3[Login shell]\n\`\`\`\n\n**A/B partitioning** for OTA updates: Two copies of the system partition. Update the inactive one, then switch. If the update fails, roll back to the previous working partition.\n\n## ⌨️ Do This\n\n1. Examine your system's init: \`ps -p 1\` — is it systemd, SysVinit, or something else?\n2. List enabled services: \`systemctl list-unit-files --state=enabled\`\n3. Write a simple systemd service unit that runs a script at boot\n4. Check your root filesystem type: \`mount | grep "on / "\`\n5. Explore BusyBox: if you have it, run \`busybox --list\` to see all built-in commands\n\n## ⚠️ Gotcha\n\n**A read-only rootfs needs writable overlays.** Many embedded products use a read-only root filesystem for reliability (can't corrupt what you can't write to). But some paths (/tmp, /var, /etc) need to be writable. Use tmpfs or overlayfs to provide writable layers on top of a read-only base.\n\n**OTA updates without A/B can brick devices.** If power fails during a single-partition update, the device won't boot. A/B partitioning solves this but doubles your storage requirement for the system partition. Know the trade-off before choosing your update strategy.\n\n## 🛠️ Mini-Project\n\nBuild a minimal rootfs from scratch (no Buildroot):\n1. Cross-compile BusyBox statically: \`make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- menuconfig\` → enable static linking → \`make install\`\n2. Create the rootfs directory structure: /bin, /sbin, /etc, /proc, /sys, /dev, /tmp\n3. Write an init script (/etc/init.d/rcS) that mounts procfs and sysfs\n4. Create a simple /etc/inittab\n5. Package as a cpio initramfs and boot with QEMU\n6. Document every file in your rootfs and why it's there\n\n## ✅ You've mastered this when…\n- You can build a minimal rootfs with BusyBox\n- You understand systemd units and service management\n- You can implement A/B partition OTA updates\n- You know when to use initramfs vs direct root mount`},

{id:'bsp-08',num:'08',title:'HAL & Platform Abstraction',hours:10,phase:1,topics:['HAL','regmap','clk framework','pinctrl'],content:`## 🎯 Goal\nDesign hardware abstraction layers and work with Linux kernel frameworks — regmap, clock, reset, and pin control.\n\n## 🧠 Linux Kernel Frameworks\n\nThe kernel provides standard frameworks so drivers don't reinvent the wheel:\n\n| Framework | Purpose |\n|-----------|--------|\n| **regmap** | Unified register access (I2C, SPI, MMIO) with caching |\n| **clk** | Clock management — enable, disable, set rate |\n| **pinctrl** | Pin multiplexing — configure which function a pin serves |\n| **reset** | Reset line management for peripherals |\n| **gpio** | GPIO abstraction — direction, value, interrupts |\n| **regulator** | Power supply management — enable, set voltage |\n\nThese frameworks handle the common patterns so driver code focuses on device-specific logic.\n\n## ⌨️ Do This\n\n1. Find a driver using regmap in the kernel source: \`grep -r "regmap_init_i2c" drivers/ | head -5\`\n2. Read how it calls \`regmap_read()\` and \`regmap_write()\` instead of raw I2C transactions\n3. Explore the clock framework: \`ls /sys/kernel/debug/clk/\` (if debugfs is mounted) to see the clock tree\n4. Check pinctrl state: \`cat /sys/kernel/debug/pinctrl/*/pins\` to see pin assignments\n\n## ⚠️ Gotcha\n\n**Regmap caching can mask hardware bugs.** Regmap caches register values by default so it doesn't re-read unchanged registers. If your hardware has a register that changes independently (like a status register), you must mark it as \`volatile\` in the regmap config. Otherwise you'll read stale cached values and wonder why your driver doesn't see hardware events.\n\n**Clock dependencies are implicit.** If your driver uses a clock but doesn't properly call \`clk_prepare_enable()\` / \`clk_disable_unprepare()\`, the clock framework might gate the clock while your hardware still needs it. Always manage clocks explicitly in your driver's probe/remove.\n\n## 🛠️ Mini-Project\n\nStudy and document a real kernel driver that uses multiple frameworks:\n1. Pick a driver (e.g., a sensor in \`drivers/iio/\`) that uses regmap + clk + pinctrl\n2. Trace the probe() function: what resources does it acquire and in what order?\n3. Draw a diagram showing: device tree → driver probe → framework calls → hardware\n4. Document the error handling path: what happens if clk_prepare_enable() fails? Does the driver clean up properly?\n5. Write a review noting any improvements you'd suggest\n\n## ✅ You've mastered this when…\n- You understand why HALs exist and what good abstraction looks like\n- You can use regmap for register access in a driver\n- You know how the clk and pinctrl frameworks work\n- You can write portable drivers that work across boards`},

{id:'bsp-09',num:'09',title:'Peripheral Drivers (I2C/SPI/UART/GPIO)',hours:10,phase:2,topics:['I2C driver','SPI driver','GPIO','IRQ'],content:`## 🎯 Goal\nWrite Linux drivers for common peripherals — I2C sensors, SPI devices, GPIO with interrupts.\n\n## 🧠 I2C Driver Structure\n\n\`\`\`mermaid\nflowchart TD\n    DT[Device Tree Entry] -->|compatible match| DRV[I2C Driver]\n    DRV -->|i2c_smbus_read_byte| BUS[I2C Bus Controller]\n    BUS -->|physical I2C| DEV[Hardware Device]\n    DRV -->|sysfs attributes| USER[Userspace]\n\`\`\`\n\nThe kernel I2C subsystem handles bus arbitration, addressing, and protocol details. Your driver only needs to implement the device-specific register reads/writes.\n\n## ⌨️ Do This\n\n1. If you have a Linux machine, scan the I2C bus: \`sudo i2cdetect -y 1\` (bus 1)\n2. Read an I2C register: \`sudo i2cget -y 1 0x48 0x00\` (address 0x48, register 0x00)\n3. Read an existing IIO sensor driver in \`drivers/iio/temperature/\` — follow the data path from hardware to sysfs\n4. Check your system's interrupt assignments: \`cat /proc/interrupts\`\n\n## ⚠️ Gotcha\n\n**Top-half vs bottom-half interrupt handling.** The interrupt handler (top-half) runs with interrupts disabled — it must be fast. Do the minimum (read status register, clear interrupt) and defer real work to a threaded IRQ handler (bottom-half). Using \`request_threaded_irq()\` is the modern pattern — the thread can sleep, take mutexes, and do I2C/SPI transactions.\n\n**I2C address collisions are silent failures.** If two devices share the same I2C address on the same bus, reads and writes corrupt silently. Always check the datasheet for configurable address pins (A0, A1) and verify with \`i2cdetect\` before writing your driver.\n\n## 🛠️ Mini-Project\n\nWrite an I2C temperature sensor driver:\n1. Create a platform driver matching a \`compatible\` string (e.g., \`"learn,virtual-temp"\`)\n2. In \`probe()\`, read the device ID register to verify the chip is present\n3. Create a sysfs attribute (\`temperature\`) that reads the temperature register and converts to millidegrees Celsius\n4. Add interrupt support: configure the sensor's alert threshold and handle the interrupt with a threaded IRQ\n5. Write a matching device tree entry and binding document\n6. Test with \`cat /sys/bus/iio/devices/iio:device0/in_temp_raw\` or your custom sysfs path\n\n## ✅ You've mastered this when…\n- You can write an I2C client driver for a real sensor\n- You handle interrupts in a driver (threaded IRQ)\n- You expose device data through sysfs or /dev\n- You use device tree bindings correctly`},

{id:'bsp-10',num:'10',title:'Display & Graphics',hours:10,phase:2,topics:['DRM/KMS','Display pipeline','GPU','Wayland'],content:`## 🎯 Goal\nUnderstand the Linux display stack — DRM/KMS, the display pipeline, and the landscape of GPU drivers and display servers.\n\n## 🧠 Display Pipeline\n\n\`\`\`mermaid\nflowchart LR\n    FB[Framebuffer<br/>Pixel data] --> CRTC[CRTC<br/>Scanout engine]\n    CRTC --> ENC[Encoder<br/>HDMI/DP/DSI]\n    ENC --> CONN[Connector<br/>Physical port]\n    CONN --> PANEL[Display Panel]\n\`\`\`\n\nDRM (Direct Rendering Manager) / KMS (Kernel Mode Setting) is the modern Linux display framework. It replaces the legacy framebuffer interface.\n\n## ⌨️ Do This\n\n1. List your display outputs: \`ls /sys/class/drm/\`\n2. Check connected displays: \`cat /sys/class/drm/card0-HDMI-A-1/status\`\n3. If you have \`modetest\` installed (from libdrm-tests): run \`modetest -c\` to list connectors and \`modetest -M\` to list modes\n4. Check your GPU driver: \`glxinfo | grep "OpenGL renderer"\` or \`cat /sys/class/drm/card0/device/driver/module/drivers/*\`\n\n## ⚠️ Gotcha\n\n**DRM (Direct Rendering Manager) has nothing to do with DRM (Digital Rights Management).** Same acronym, completely unrelated. In BSP context, it's always the display framework.\n\n**GPU driver support is the #1 pain point in embedded Linux display.** Many SoC vendors provide proprietary GPU drivers that only work with specific kernel versions. Mesa (open-source GPU drivers) is the ideal but coverage varies — Arm Mali support via Panfrost is improving but not universal. Always verify GPU driver availability before choosing a display SoC.\n\n## 🛠️ Mini-Project\n\nExplore the DRM subsystem:\n1. Write a simple program using libdrm to enumerate connectors, encoders, and CRTCs\n2. Set a display mode programmatically (resolution + refresh rate)\n3. Draw a colored rectangle directly to a DRM framebuffer (dumb buffer)\n4. Document the full pipeline: your program → libdrm → DRM/KMS kernel driver → hardware\n5. If using QEMU, use the virtio-gpu device for testing\n\n## ✅ You've mastered this when…\n- You understand the DRM/KMS pipeline (planes → CRTC → encoder → connector)\n- You know the difference between DRM and legacy framebuffer\n- You can navigate the GPU driver landscape (open vs proprietary)\n- You understand Wayland vs X11 and why the transition matters`},

{id:'bsp-11',num:'11',title:'Audio Subsystem',hours:10,phase:2,topics:['ALSA','ASoC','DAPM','PipeWire','Codec'],content:`## 🎯 Goal\nUnderstand the Linux audio stack — ALSA, ASoC framework, and audio routing.\n\n## 🧠 ASoC Architecture\n\n\`\`\`mermaid\nflowchart LR\n    APP[Application] --> PA[PipeWire/PulseAudio]\n    PA --> ALSA[ALSA Core]\n    ALSA --> MACH[Machine Driver<br/>Board-specific routing]\n    MACH --> PLAT[Platform Driver<br/>DMA, I2S controller]\n    MACH --> CODEC[Codec Driver<br/>DAC/ADC chip]\n\`\`\`\n\nASoC splits audio into three driver types: Machine (board-specific), Platform (SoC audio DMA/I2S), and Codec (the audio chip). DAPM (Dynamic Audio Power Management) automatically manages power for audio paths.\n\n## ⌨️ Do This\n\n1. List audio devices: \`aplay -l\` (playback) and \`arecord -l\` (capture)\n2. Play a test tone: \`speaker-test -t sine -f 440\` (440 Hz = concert A)\n3. Inspect ALSA controls: \`amixer contents\` — look at volume controls, switches, and routes\n4. Check if PipeWire or PulseAudio is running: \`pactl info\` or \`pw-cli info\`\n\n## ⚠️ Gotcha\n\n**DAPM silently mutes audio paths.** DAPM (Dynamic Audio Power Management) automatically powers down unused audio routes. If you can't hear audio, it's often because DAPM determined the path is unused (a widget isn't connected, or a mixer control is off). Use \`amixer\` to check that all controls in the audio path are enabled, and check DAPM widget states in debugfs.\n\n**Machine drivers are board-specific glue.** The platform (SoC I2S) and codec (audio chip) drivers are reusable, but the machine driver ties them together for your specific board's wiring. If audio doesn't work after a board revision, the machine driver is usually where the routing changed.\n\n## 🛠️ Mini-Project\n\nMap the audio subsystem on your machine:\n1. Identify the audio codec chip (check \`dmesg | grep -i codec\` or the device tree)\n2. Draw the audio pipeline: application → PipeWire/PulseAudio → ALSA → machine driver → platform (I2S) → codec → speaker/headphone\n3. List all ALSA mixer controls and document what each one does\n4. Record audio from the microphone and play it back — measure the round-trip latency\n5. If on embedded: read the machine driver source and trace the DAPM widget connections\n\n## ✅ You've mastered this when…\n- You understand the ALSA/ASoC architecture\n- You know the three ASoC driver types and their responsibilities\n- You can trace audio routing through DAPM widgets\n- You understand the PulseAudio → PipeWire transition`},

{id:'bsp-12',num:'12',title:'Camera & Multimedia',hours:10,phase:2,topics:['V4L2','ISP','Media controller','GStreamer'],content:`## 🎯 Goal\nUnderstand the Linux camera and multimedia stack — V4L2, media controller, ISP pipeline, and video processing with GStreamer.\n\n## 🧠 Camera Pipeline\n\n\`\`\`mermaid\nflowchart LR\n    SENSOR[Camera Sensor<br/>MIPI CSI-2] --> CSI[CSI Receiver]\n    CSI --> ISP[Image Signal Processor<br/>Demosaic, denoise, AWB]\n    ISP --> VPU[Video Encoder<br/>H.264/H.265]\n    ISP --> APP[Application<br/>via V4L2]\n\`\`\`\n\nV4L2 (Video4Linux2) is the kernel framework for video capture/output devices. The Media Controller API describes the topology of the pipeline.\n\n## ⌨️ Do This\n\n1. List video devices: \`v4l2-ctl --list-devices\`\n2. List supported formats: \`v4l2-ctl -d /dev/video0 --list-formats-ext\`\n3. Capture a single frame: \`v4l2-ctl -d /dev/video0 --stream-mmap --stream-count=1 --stream-to=frame.raw\`\n4. If you have GStreamer: \`gst-launch-1.0 v4l2src ! videoconvert ! autovideosink\` (shows camera preview)\n5. Explore the media controller topology: \`media-ctl -p\` (if available)\n\n## ⚠️ Gotcha\n\n**The media controller topology must be configured before capture.** On complex camera systems (SoC with ISP), you can't just open /dev/video0 and start capturing. You must first configure the media controller pipeline — set formats on each pad, link entities together. The \`media-ctl\` tool handles this, but your application must do it too.\n\n**Raw sensor data looks terrible without ISP processing.** A raw Bayer image from the sensor is a mosaic of red, green, and blue pixels. The ISP demosaics it into a full-color image and applies auto white balance, noise reduction, and exposure correction. Skipping the ISP means green-tinted, noisy, dim images.\n\n## 🛠️ Mini-Project\n\nBuild a camera capture pipeline:\n1. Connect a USB camera or use a virtual camera (\`sudo modprobe v4l2loopback\`)\n2. Write a GStreamer pipeline that captures video, resizes to 640x480, encodes to H.264, and saves to a file\n3. Add a live preview branch using a tee element\n4. Measure capture latency: timestamp when the frame is captured vs when it's displayed\n5. Document the V4L2 format negotiation: what formats does the device support, and which did GStreamer choose?\n\n## ✅ You've mastered this when…\n- You understand V4L2 and the media controller API\n- You can trace data flow through a camera pipeline\n- You know what the ISP does and why raw sensor data needs processing\n- You can build GStreamer pipelines for video processing`},

{id:'bsp-13',num:'13',title:'Connectivity',hours:10,phase:2,topics:['WiFi','Bluetooth','Cellular','mac80211','QMI'],content:`## 🎯 Goal\nUnderstand Linux connectivity stacks — WiFi (cfg80211/mac80211), Bluetooth (BlueZ), and cellular modem integration.\n\n## 🧠 WiFi Stack\n\n\`\`\`mermaid\nflowchart TD\n    APP[Application] --> NM[NetworkManager / wpa_supplicant]\n    NM --> NL[nl80211<br/>Netlink interface]\n    NL --> CFG[cfg80211<br/>Configuration layer]\n    CFG --> MAC[mac80211<br/>Software MAC layer]\n    MAC --> DRV[WiFi Driver<br/>Hardware-specific]\n    DRV --> HW[WiFi Chipset]\n\`\`\`\n\n**FullMAC vs SoftMAC:** FullMAC chips handle MAC layer in firmware (simpler driver). SoftMAC chips rely on mac80211 in the kernel (more flexible, more driver work).\n\n## ⌨️ Do This\n\n1. Scan WiFi networks: \`sudo iw dev wlan0 scan | grep SSID\`\n2. Check WiFi driver and chipset: \`lspci | grep -i wireless\` or \`lsusb | grep -i wireless\`, then \`sudo iw dev wlan0 info\`\n3. List Bluetooth devices: \`bluetoothctl\` → \`scan on\` → \`devices\`\n4. Check if your WiFi driver is FullMAC or SoftMAC: \`ls /sys/module/cfg80211/\` and \`ls /sys/module/mac80211/\`\n\n## ⚠️ Gotcha\n\n**Regulatory domain affects which WiFi channels and power levels are legal.** Different countries allow different frequency bands and transmission power. If your device ships globally, it must comply with local regulations. The Linux wireless regulatory database (\`wireless-regdb\`) handles this, but misconfiguration can make channels unavailable or violate regulations.\n\n**Firmware blobs are the hidden dependency.** Most WiFi and Bluetooth chipsets require proprietary firmware loaded by the kernel at runtime. These binaries live in \`/lib/firmware/\` and must match your kernel version and chipset revision. A firmware mismatch can cause silent failures — the device appears to work but drops packets or disconnects randomly.\n\n## 🛠️ Mini-Project\n\nSet up a WiFi access point on Linux:\n1. Install hostapd: \`sudo apt install hostapd\`\n2. Configure hostapd.conf: set SSID, channel, WPA2 passphrase, and bridge interface\n3. Set up DHCP for clients: configure dnsmasq to assign IP addresses\n4. Enable IP forwarding and NAT so clients can reach the internet\n5. Test: connect a phone to your AP and browse the web\n6. Document the full stack: hostapd → nl80211 → cfg80211 → mac80211 → driver → hardware\n\n## ✅ You've mastered this when…\n- You understand the WiFi stack layers (nl80211 → cfg80211 → mac80211)\n- You know FullMAC vs SoftMAC and their driver implications\n- You can configure Bluetooth using BlueZ\n- You understand cellular modem integration (QMI/AT commands)`},

{id:'bsp-14',num:'14',title:'Power & Thermal Frameworks',hours:8,phase:2,topics:['cpufreq','cpuidle','Thermal','Suspend','PM runtime'],content:`## 🎯 Goal\nWork with Linux power and thermal management frameworks — cpufreq, cpuidle, thermal zones, and system suspend/resume.\n\n## 🧠 Power Management Stack\n\n\`\`\`mermaid\nflowchart TD\n    GOV[Governor<br/>Policy decisions] --> CPUFREQ[cpufreq<br/>Frequency scaling]\n    GOV --> CPUIDLE[cpuidle<br/>Idle state selection]\n    GOV --> DEVFREQ[devfreq<br/>Device frequency scaling]\n    TZ[Thermal Zones] --> COOL[Cooling Devices]\n    COOL --> CPUFREQ\n    PM[PM Runtime] --> DRV[Device Drivers]\n\`\`\`\n\n**cpufreq governors:** performance (always max), powersave (always min), ondemand (scale based on load), schedutil (scheduler-integrated).\n\n**Thermal management:** Thermal zones report temperature. When thresholds are crossed, cooling devices activate — CPU frequency reduction, GPU throttling, fan control.\n\n## ⌨️ Do This\n\n1. Check available cpufreq governors: \`cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors\`\n2. See current frequency: \`cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq\`\n3. List thermal zones: \`ls /sys/class/thermal/\` and check temperatures: \`cat /sys/class/thermal/thermal_zone0/temp\`\n4. Monitor power states: \`turbostat\` (Intel) or \`cat /sys/devices/system/cpu/cpu*/cpuidle/state*/name\`\n\n## ⚠️ Gotcha\n\n**Aggressive thermal throttling masks performance bugs.** If your application is slow and the CPU frequency keeps dropping, the problem might not be thermal — it could be a runaway background process generating heat. Always check CPU utilization alongside thermal data.\n\n**Sleep state transitions have real costs.** Deep sleep states save more power but take longer to wake from. A device that enters deep sleep during a real-time task will miss its deadline. Profile the wake latency of each sleep state before choosing your idle governor policy for latency-sensitive workloads.\n\n## 🛠️ Mini-Project\n\nCreate a thermal monitoring dashboard:\n1. Write a script that polls thermal zones and CPU frequency every second\n2. Log to a CSV: timestamp, temperature (each zone), CPU frequency, governor\n3. Run a CPU stress test (\`stress-ng --cpu 4\`) and observe thermal throttling in real time\n4. Plot temperature vs frequency over time to visualize the throttling behavior\n5. Experiment with different governors (performance vs schedutil) and compare thermal profiles\n\n## ✅ You've mastered this when…\n- You can configure cpufreq governors and understand their trade-offs\n- You know how thermal zones and cooling devices interact\n- You understand system suspend/resume and PM runtime\n- You can debug power/thermal issues using sysfs and tracing`},

{id:'bsp-15',num:'15',title:'Capstone — BSP Integration & Release',hours:12,phase:2,topics:['Validation','Porting','Release','Upstream'],content:`## 🎯 Goal\nPort a BSP to a new board, validate it, and prepare for release — the complete BSP engineering cycle.\n\n## 🧠 BSP Porting Process\n\n\`\`\`mermaid\nflowchart LR\n    REF[Reference BSP<br/>Silicon vendor] --> PORT[Port to target board]\n    PORT --> DT2[Customize device tree]\n    DT2 --> DRV2[Add/modify drivers]\n    DRV2 --> VAL[Validation & Testing]\n    VAL --> OPT[Optimization<br/>Boot time, power]\n    OPT --> REL[Release Package]\n\`\`\`\n\n**Validation strategy:** Kernel selftests (kselftest), LKFT (Linux Kernel Functional Testing), peripheral-specific test suites, stress testing, power measurement.\n\n**Upstream contribution:** Getting your driver accepted into the mainline Linux kernel. Benefits: maintenance shifts to the community, your hardware works out-of-the-box in future kernels. Process: follow kernel coding style, submit patches to mailing lists, iterate on review feedback.\n\n## 🛠️ Capstone Project\n\nFull BSP integration exercise:\n- Start with a reference BSP for a development board\n- Customize the device tree for your configuration\n- Write a driver for an I2C sensor\n- Build a complete image with Buildroot\n- Boot, validate all peripherals, measure boot time\n- Document the BSP: hardware requirements, build instructions, known issues\n- Submit one patch upstream (even a documentation fix counts)\n\n## ⌨️ Do This\n\n1. Clone a reference BSP for a development board (Raspberry Pi, BeagleBone, or STM32MP1)\n2. Build it from source following the vendor's instructions\n3. Flash and boot on real hardware (or QEMU if no board available)\n4. Run the vendor's validation tests if provided\n5. Measure boot time end-to-end: power-on to login prompt\n\n## ⚠️ Gotcha\n\n**Upstream acceptance is slow — plan for it.** Getting a driver into the mainline kernel typically takes 3–6 months of review cycles. Reviewers are volunteers with limited bandwidth, and they will request multiple revisions. Start with small patches (documentation fixes, trivial cleanups) to learn the process before submitting a full driver.\n\n**"Works on my board" is not validation.** A BSP must be tested across: cold boot, warm boot, suspend/resume cycles, peripheral stress testing, and extended uptime (72+ hours). Intermittent bugs in clock configuration or power sequencing only appear under specific conditions. Automate your test suite early.\n\n## ✅ You've mastered the BSP track when…\n- You can port a BSP to a new board\n- You've written and tested a real kernel driver\n- Your BSP boots reliably with all peripherals working\n- You understand the upstream contribution process\n- You can hand your BSP to another engineer and they can build and boot it from your docs`}
];

{id:'ai-00',num:'00',title:'Setup & Tools',hours:4,phase:0,topics:['VS Code','Terminal','Node','Python'],content:`
## 🎯 Goal
Set up a professional development environment you'll use throughout every track. Install and configure VS Code, a terminal, Node.js, and Python — the two runtimes that power modern AI application development.

## 🧠 Your Toolchain

You need four things before you write a single line of code:

\`\`\`mermaid
flowchart LR
    E[Editor<br/>VS Code] --> T[Terminal<br/>bash / zsh]
    T --> N[Node.js<br/>JS runtime]
    T --> P[Python<br/>ML runtime]
    N --> PM1[npm / pnpm]
    P --> PM2[pip / uv]
\`\`\`

### VS Code — Your Editor

VS Code is the dominant editor for web and AI development. Not because it's the "best" editor in some abstract sense — it's because its extension ecosystem is unmatched, and nearly every AI framework has VS Code tooling.

**Install these extensions first:**
- **ESLint** — catches JS/TS mistakes before they run
- **Prettier** — auto-formats on save so you stop arguing about tabs
- **Python** (Microsoft) — IntelliSense, linting, debugging
- **Jupyter** — run notebooks inside VS Code (you'll use these constantly in ML work)
- **GitLens** — see who changed what, when, and why

**Settings that matter:** Open settings JSON (\`Cmd/Ctrl+Shift+P\` → "Preferences: Open Settings JSON") and add:

\`\`\`json
{
  "editor.formatOnSave": true,
  "editor.defaultFormatter": "esbenp.prettier-vscode",
  "editor.tabSize": 2,
  "files.autoSave": "onFocusChange",
  "terminal.integrated.defaultProfile.osx": "zsh"
}
\`\`\`

### Terminal — Learn It Early

Every deployment, every Docker container, every CI pipeline runs through a terminal. If you only use GUIs, you'll hit a wall the moment you try to deploy anything.

**Key commands you'll use daily:**

| Command | What it does |
|---------|-------------|
| \`cd path/to/dir\` | Change directory |
| \`ls -la\` | List all files with permissions |
| \`mkdir -p a/b/c\` | Create nested directories |
| \`cat file.txt\` | Print file contents |
| \`which python3\` | Find where a binary lives |
| \`echo $PATH\` | Show your PATH (where the shell looks for programs) |
| \`history \\| grep "docker"\` | Search command history |

⚠️ **Gotcha:** On macOS, the default Python is the system Python (often 2.7 or a locked-down 3.x). Never install packages into the system Python — use a version manager.

### Node.js — The JavaScript Runtime

Node runs JavaScript outside the browser. You'll use it for building API servers, running AI agent frameworks, and tooling.

**Install with nvm** (Node Version Manager) — never install Node directly from the website:

\`\`\`bash
# Install nvm
curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash

# Install latest LTS
nvm install --lts
nvm use --lts

# Verify
node --version  # Should show v20.x or v22.x
npm --version
\`\`\`

### Python — The ML Runtime

Python is non-negotiable for AI/ML. Every major ML library (PyTorch, TensorFlow, HuggingFace, LangChain) is Python-first.

**Install with pyenv:**

\`\`\`bash
# macOS
brew install pyenv

# Add to your shell config (~/.zshrc or ~/.bashrc)
echo 'eval "$(pyenv init -)"' >> ~/.zshrc

# Install Python 3.11+ (the sweet spot for ML libraries right now)
pyenv install 3.11.9
pyenv global 3.11.9

# Verify
python --version  # Should show 3.11.9
\`\`\`

**Virtual environments** — always use them:

\`\`\`bash
python -m venv .venv
source .venv/bin/activate  # On Windows: .venv\\Scripts\\activate
pip install requests openai
\`\`\`

⚠️ **Gotcha:** If you see \`ModuleNotFoundError\` after installing a package, you're probably not in the right virtual environment. Run \`which python\` — it should point to \`.venv/bin/python\`, not \`/usr/bin/python\`.

## ⌨️ Do This — Verify Your Setup

Run each of these and confirm they succeed:

\`\`\`bash
code --version         # VS Code CLI
node --version         # Node.js
npm --version          # npm
python --version       # Python 3.11+
git --version          # Git (you'll configure this in the next module)
\`\`\`

Create a test project:

\`\`\`bash
mkdir ~/witbyte-sandbox && cd ~/witbyte-sandbox
echo "console.log('Node works')" > test.js && node test.js
echo "print('Python works')" > test.py && python test.py
\`\`\`

## 🛠️ Mini-Project

Create a \`dev-check.sh\` script that prints the version of every tool in your toolchain (node, npm, python, pip, git, code) and flags any that are missing or outdated. The script should exit with code 1 if any critical tool is missing. Run it every time you set up a new machine.

## ✅ You've mastered this when…

- VS Code opens from the terminal with \`code .\`
- You can navigate your filesystem, create files, and search history in the terminal without reaching for Finder/Explorer
- Node.js is managed by nvm and you can switch between versions
- Python is managed by pyenv with a virtual environment activated
- You understand why version managers exist (hint: different projects need different versions)
`},
{id:'ai-01',num:'01',title:'Git & GitHub',hours:8,phase:0,topics:['Version control','Branch','Merge','PR'],content:`
## 🎯 Goal
Use Git for version control and GitHub for collaboration. Understand branching, merging, pull requests, and the mental model behind Git's directed acyclic graph — not just the commands, but what they actually do to your history.

## 🧠 Why Version Control

Without version control, your "backup" strategy is \`final_v2_FINAL_REAL.py\`. With Git, every change is a snapshot you can return to, compare, or branch from.

\`\`\`mermaid
gitGraph
    commit id: "init"
    commit id: "add model"
    branch feature
    commit id: "try RAG"
    commit id: "fix retriever"
    checkout main
    commit id: "update API"
    merge feature id: "merge RAG"
    commit id: "deploy"
\`\`\`

Git tracks **content, not files**. Every commit is a snapshot of the entire project at that moment, identified by a SHA hash. Branches are just pointers to commits — they're lightweight, not copies.

### The Three Areas

\`\`\`mermaid
flowchart LR
    WD[Working Directory<br/>Your files on disk] -->|git add| SA[Staging Area<br/>What you're about to commit]
    SA -->|git commit| LR[Local Repo<br/>Your commit history]
    LR -->|git push| RR[Remote Repo<br/>GitHub]
    RR -->|git pull| WD
\`\`\`

**Working Directory** → the files you see. **Staging Area** → your curated "next commit." **Repository** → the full history.

This three-stage design is intentional: it lets you commit logically related changes together, even if you modified 10 files across 3 different concerns.

## 🧠 Core Workflow

\`\`\`bash
# Start a new feature
git checkout -b feature/add-search

# Work, then stage specific files
git add src/search.js src/index.js
git status                           # Always check before committing

# Commit with a meaningful message
git commit -m "Add full-text search with Fuse.js"

# Push to GitHub
git push -u origin feature/add-search

# Create a Pull Request on GitHub, get review, merge
\`\`\`

### Branching Strategies

| Strategy | How it works | Best for |
|----------|-------------|----------|
| **Feature branches** | One branch per feature, merge to main | Most teams |
| **Git Flow** | develop, feature, release, hotfix branches | Release-based products |
| **Trunk-based** | Short-lived branches, merge to main daily | CI/CD-heavy teams |

For most AI projects, feature branches are the right call. Keep branches short-lived — a branch that lives for two weeks is a merge conflict waiting to happen.

### Merge vs Rebase

**Merge** preserves history as-is. You'll see merge commits.

**Rebase** rewrites history to create a linear sequence. Cleaner log, but never rebase commits you've already pushed — it rewrites SHAs, and anyone who pulled the old commits will have a bad day.

Rule of thumb: **rebase your own local work before pushing, merge shared branches.**

## ⌨️ Do This — Practice the Full Cycle

1. Create a repo on GitHub (with a README)
2. Clone it locally
3. Create a branch, make changes, commit, push
4. Open a Pull Request on GitHub
5. Add a review comment on your own PR
6. Merge the PR
7. Pull the merged changes locally

Then practice conflict resolution:

\`\`\`bash
# Create two branches that edit the same line
git checkout -b branch-a
echo "version A" > conflict.txt && git add . && git commit -m "A"

git checkout main
git checkout -b branch-b
echo "version B" > conflict.txt && git add . && git commit -m "B"

# Merge branch-a into main, then try merging branch-b → conflict!
git checkout main && git merge branch-a
git merge branch-b  # Resolve the conflict manually
\`\`\`

⚠️ **Gotcha:** \`git pull\` is actually \`git fetch\` + \`git merge\`. If you want to see what changed before merging, use \`git fetch\` first, then \`git log origin/main..main\` to compare.

## 🛠️ Mini-Project

Set up a "dotfiles" repo — your personal configuration files (shell config, VS Code settings, Git aliases). Structure it so cloning the repo onto a new machine and running one script configures your entire dev environment. Include a \`.gitconfig\` with useful aliases:

\`\`\`ini
[alias]
    lg = log --oneline --graph --all --decorate
    st = status -sb
    co = checkout
    last = log -1 HEAD --stat
\`\`\`

## ✅ You've mastered this when…

- You can explain what a commit SHA represents and how Git stores snapshots
- You create feature branches, open PRs, and merge without anxiety
- You can resolve a merge conflict by hand and know what the conflict markers mean
- You understand the difference between merge and rebase and when to use each
- You can read \`git log --oneline --graph\` and understand the branch topology
`},
{id:'ai-02',num:'02',title:'Web Foundations',hours:10,phase:0,topics:['HTTP','DOM','HTML/CSS/JS'],content:`
## 🎯 Goal
Understand how the web works at the protocol level. Know HTTP, the DOM, and enough HTML/CSS/JS to build interfaces for AI applications. This isn't "learn web dev from scratch" — it's "learn the web stack fast so you can ship AI tools that humans can actually use."

## 🧠 How the Web Works

Every time you open a webpage, this happens:

\`\`\`mermaid
sequenceDiagram
    participant B as Browser
    participant D as DNS
    participant S as Server
    B->>D: What's the IP for api.example.com?
    D-->>B: 93.184.216.34
    B->>S: GET /index.html (HTTP request)
    S-->>B: 200 OK + HTML document
    B->>S: GET /style.css
    S-->>B: 200 OK + CSS
    B->>S: GET /app.js
    S-->>B: 200 OK + JavaScript
    Note over B: Browser parses HTML → builds DOM → applies CSS → runs JS
\`\`\`

### HTTP — The Protocol

HTTP is a request-response protocol. The client sends a **request**, the server returns a **response**. Every AI API you'll ever call (OpenAI, Anthropic, HuggingFace) uses HTTP.

**Request anatomy:**

\`\`\`
POST /v1/chat/completions HTTP/1.1
Host: api.openai.com
Authorization: Bearer sk-...
Content-Type: application/json

{"model": "gpt-4", "messages": [{"role": "user", "content": "Hello"}]}
\`\`\`

**The methods that matter:**

| Method | Purpose | Idempotent? | Body? |
|--------|---------|-------------|-------|
| GET | Read data | Yes | No |
| POST | Create / trigger action | No | Yes |
| PUT | Replace entirely | Yes | Yes |
| PATCH | Partial update | No | Yes |
| DELETE | Remove | Yes | No |

**Status codes** — memorize the families:
- **2xx** — success (200 OK, 201 Created, 204 No Content)
- **3xx** — redirect (301 Moved, 304 Not Modified)
- **4xx** — client error (400 Bad Request, 401 Unauthorized, 404 Not Found, 429 Too Many Requests)
- **5xx** — server error (500 Internal Server Error, 503 Service Unavailable)

⚠️ **Gotcha:** 429 is the most important status code in AI development. Every LLM API has rate limits. You'll see 429 constantly. Build retry logic with exponential backoff from day one.

### The DOM — How Browsers See HTML

The DOM (Document Object Model) is a tree representation of the HTML. JavaScript manipulates this tree to create interactive interfaces.

\`\`\`mermaid
flowchart TD
    DOC[document] --> HTML[html]
    HTML --> HEAD[head]
    HTML --> BODY[body]
    HEAD --> TITLE[title<br/>'My App']
    BODY --> H1[h1<br/>'Hello']
    BODY --> DIV[div.container]
    DIV --> P[p<br/>'Content here']
    DIV --> BTN[button<br/>'Click me']
\`\`\`

JavaScript interacts with the DOM:

\`\`\`javascript
// Find elements
const btn = document.querySelector('button');
const container = document.querySelector('.container');

// Listen for events
btn.addEventListener('click', () => {
  const p = document.createElement('p');
  p.textContent = 'New paragraph added!';
  container.appendChild(p);
});

// Modify existing elements
document.querySelector('h1').style.color = '#2563eb';
\`\`\`

## 🧠 HTML/CSS/JS — The Minimum You Need

### HTML — Structure

HTML is a markup language, not a programming language. It describes content hierarchy:

\`\`\`html
<main>
  <h1>AI Chat Interface</h1>
  <div id="messages"></div>
  <form id="chat-form">
    <input type="text" id="user-input" placeholder="Ask something..." />
    <button type="submit">Send</button>
  </form>
</main>
\`\`\`

**Semantic elements matter:** Use \`<main>\`, \`<nav>\`, \`<article>\`, \`<section>\` instead of nesting everything in \`<div>\`. It's better for accessibility and SEO.

### CSS — Presentation

Modern CSS uses **Flexbox** and **Grid** for layout, CSS custom properties for theming:

\`\`\`css
:root {
  --bg: #faf9f7;
  --ink: #17161a;
  --accent: #2563eb;
}

.chat-container {
  display: flex;
  flex-direction: column;
  max-width: 640px;
  margin: 0 auto;
  gap: 12px;
}

.message {
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
}
\`\`\`

### JavaScript — Behavior

The JS you need for AI apps boils down to: **fetch data from APIs** and **update the DOM**.

\`\`\`javascript
// The pattern you'll use hundreds of times
async function askAI(question) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: question })
  });

  if (!response.ok) throw new Error(\\\`HTTP \\\${response.status}\\\`);
  const data = await response.json();
  return data.reply;
}
\`\`\`

⚠️ **Gotcha:** \`fetch\` doesn't throw on 4xx/5xx errors — it only rejects on network failures. Always check \`response.ok\` before parsing the body.

## ⌨️ Do This — Build a Minimal Chat UI

Build a single HTML file that:
1. Has an input field and send button
2. On submit, appends the user's message to a chat log
3. Calls a mock API endpoint (or just returns a hardcoded response after a 500ms delay using \`setTimeout\`)
4. Appends the "AI response" below the user message
5. Auto-scrolls to the latest message

No frameworks. No build tools. Just one HTML file with embedded CSS and JS. Open it in your browser with \`open index.html\`.

## 🛠️ Mini-Project

Build a "Fetch Inspector" — a webpage where you enter a URL, click "Inspect," and it displays the response status code, headers (as a table), response time, content type, and the first 500 characters of the body. Use \`fetch\` and \`performance.now()\` for timing. Style it so it looks like a developer tool, not a homework assignment.

## ✅ You've mastered this when…

- You can explain the HTTP request/response cycle without looking anything up
- You know the difference between GET and POST and when to use each
- You can build a simple interactive UI with vanilla HTML, CSS, and JavaScript
- You can use \`fetch\` to call an API and handle both success and error responses
- You understand the DOM as a tree and can manipulate it with JS
`},
{id:'ai-03',num:'03',title:'MERN Stack',hours:14,phase:0,topics:['React','Express','MongoDB','Node'],content:`
## 🎯 Goal
Build full-stack applications with the MERN stack — MongoDB, Express, React, Node.js. This is the stack most AI application prototypes are built on: a React frontend for the UI, an Express/Node backend for API routing and LLM orchestration, and MongoDB for storing conversations, embeddings, and user data.

## 🧠 The MERN Architecture

\`\`\`mermaid
flowchart LR
    subgraph "Frontend"
        R[React<br/>UI Components]
    end
    subgraph "Backend"
        E[Express<br/>API Routes]
        N[Node.js<br/>Runtime]
    end
    subgraph "Database"
        M[MongoDB<br/>Documents]
    end
    R -->|HTTP/fetch| E
    E --> N
    N -->|Mongoose| M
    N -->|API calls| AI[LLM APIs<br/>OpenAI, Anthropic]
\`\`\`

### Why MERN for AI Apps?

**MongoDB** stores unstructured data well — chat histories, embeddings, tool call logs. No rigid schema means you can iterate fast.

**Express/Node** handles async I/O efficiently — important when your API routes are waiting on LLM responses that take 2-10 seconds.

**React** makes building interactive chat UIs, streaming responses, and complex forms manageable.

## 🧠 React — Component-Based UI

React splits your UI into reusable components. Each component manages its own state and renders based on that state.

\`\`\`javascript
// A chat message component
function Message({ role, content }) {
  return (
    <div className={\\\`message \\\${role}\\\`}>
      <span className="role">{role === 'user' ? 'You' : 'AI'}</span>
      <p>{content}</p>
    </div>
  );
}

// The chat interface — manages a list of messages
function Chat() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');

  async function handleSend(e) {
    e.preventDefault();
    const userMsg = { role: 'user', content: input };
    setMessages(prev => [...prev, userMsg]);
    setInput('');

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [...messages, userMsg] })
    });
    const data = await res.json();
    setMessages(prev => [...prev, { role: 'assistant', content: data.reply }]);
  }

  return (
    <div className="chat">
      {messages.map((m, i) => <Message key={i} {...m} />)}
      <form onSubmit={handleSend}>
        <input value={input} onChange={e => setInput(e.target.value)} />
        <button type="submit">Send</button>
      </form>
    </div>
  );
}
\`\`\`

**Key React concepts:**
- **useState** — local state within a component
- **useEffect** — side effects (fetch data on mount, set up listeners)
- **Props** — data passed from parent to child
- **Conditional rendering** — show loading spinner while waiting for LLM response

### Express — API Server

Express is a minimal web framework for Node. Your AI backend is typically a set of Express routes that receive requests, call LLM APIs, and return responses.

\`\`\`javascript
import express from 'express';
import OpenAI from 'openai';

const app = express();
app.use(express.json());

const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

app.post('/api/chat', async (req, res) => {
  try {
    const { messages } = req.body;
    const completion = await openai.chat.completions.create({
      model: 'gpt-4',
      messages
    });
    res.json({ reply: completion.choices[0].message.content });
  } catch (err) {
    console.error(err);
    res.status(500).json({ error: 'LLM call failed' });
  }
});

app.listen(3001, () => console.log('API running on :3001'));
\`\`\`

⚠️ **Gotcha:** Never expose your API keys in frontend code. The React app calls YOUR Express backend, and your backend calls the LLM API. The API key lives in \`.env\` on the server, never in the browser.

### MongoDB — Document Storage

MongoDB stores JSON-like documents. No fixed schema — perfect for AI app data that evolves fast.

\`\`\`javascript
import mongoose from 'mongoose';

// Define a schema (flexible, not rigid)
const conversationSchema = new mongoose.Schema({
  userId: String,
  messages: [{
    role: { type: String, enum: ['user', 'assistant', 'system'] },
    content: String,
    timestamp: { type: Date, default: Date.now }
  }],
  metadata: mongoose.Schema.Types.Mixed  // Store anything
}, { timestamps: true });

const Conversation = mongoose.model('Conversation', conversationSchema);

// Save a conversation
const conv = await Conversation.create({
  userId: 'user_123',
  messages: [
    { role: 'user', content: 'What is RAG?' },
    { role: 'assistant', content: 'RAG stands for...' }
  ],
  metadata: { model: 'gpt-4', tokens: 150 }
});

// Query conversations
const recent = await Conversation.find({ userId: 'user_123' })
  .sort({ createdAt: -1 })
  .limit(10);
\`\`\`

## ⌨️ Do This — Scaffold a MERN Project

\`\`\`bash
# Create project structure
mkdir ai-chat && cd ai-chat

# Backend
mkdir server && cd server
npm init -y
npm install express mongoose openai dotenv cors
# Create server/index.js with the Express code above

# Frontend
cd ..
npx create-react-app client
cd client
# Build the Chat component from above

# Run both
# Terminal 1: cd server && node index.js
# Terminal 2: cd client && npm start
\`\`\`

⚠️ **Gotcha:** You'll hit CORS errors when React (port 3000) calls Express (port 3001). Add \`app.use(cors())\` to your Express app, or add \`"proxy": "http://localhost:3001"\` to the React app's \`package.json\`.

## 🛠️ Mini-Project

Build a "Prompt Playground" — a full-stack app where you can:
1. Type a system prompt and a user message
2. Select a model and temperature via dropdowns
3. Send the request to your Express backend, which calls an LLM API
4. Display the response with metadata (token count, latency)
5. Save conversations to MongoDB and display a history sidebar

This is the app you'll use to test prompts throughout the rest of the AI track.

## ✅ You've mastered this when…

- You can explain the data flow from React → Express → MongoDB and back
- You can set up a new MERN project from scratch in under 15 minutes
- You understand React state management with \`useState\` and \`useEffect\`
- You can create Express API routes that call external APIs
- You know where API keys belong (server-side \`.env\`) and why they never go in React code
- You can model and query data in MongoDB using Mongoose
`},
{id:'ai-04',num:'04',title:'Build a Web App',hours:12,phase:0,topics:['Auth','Deploy','Structure'],content:`
## 🎯 Goal
Take the MERN skills from the previous module and ship a real web application — with authentication, deployment, and a project structure that won't collapse at 5,000 lines. This is where you learn the difference between "it works on my laptop" and "it works in production."

## 🧠 Project Structure That Scales

A flat file dump stops working fast. Organize your project so a new contributor can find anything in under 30 seconds:

\`\`\`mermaid
flowchart TD
    ROOT[project root] --> CLIENT[client/]
    ROOT --> SERVER[server/]
    ROOT --> SHARED[shared/]
    ROOT --> CONFIG[config files]
    CLIENT --> SRC[src/]
    SRC --> COMP[components/]
    SRC --> PAGES[pages/]
    SRC --> HOOKS[hooks/]
    SRC --> UTILS[utils/]
    SERVER --> ROUTES[routes/]
    SERVER --> MODELS[models/]
    SERVER --> MIDDLEWARE[middleware/]
    SERVER --> SERVICES[services/]
    CONFIG --> ENV[.env.example]
    CONFIG --> PKG[package.json]
    CONFIG --> DOCKER[Dockerfile]
\`\`\`

**Rules:**
- \`components/\` — reusable UI pieces (Button, Modal, ChatBubble)
- \`pages/\` — full pages that compose components (Dashboard, Settings)
- \`hooks/\` — custom React hooks (useChat, useAuth)
- \`services/\` — business logic and external API integrations (the LLM call logic lives here, not in route handlers)
- \`middleware/\` — Express middleware (auth check, rate limiting, error handler)

### Environment Variables

\`\`\`bash
# .env.example — committed to git (no secrets)
PORT=3001
MONGODB_URI=mongodb://localhost:27017/myapp
OPENAI_API_KEY=your-key-here
JWT_SECRET=your-secret-here

# .env — NOT committed (in .gitignore)
PORT=3001
MONGODB_URI=mongodb+srv://user:pass@cluster.mongodb.net/myapp
OPENAI_API_KEY=sk-proj-abc123...
JWT_SECRET=a7f2c9d1...
\`\`\`

⚠️ **Gotcha:** \`.env\` must be in \`.gitignore\` BEFORE your first commit. If you accidentally commit secrets and push, rotating the key isn't optional — it's already been scraped by bots that monitor GitHub in real-time.

## 🧠 Authentication — JWT Flow

Most AI apps need user accounts (to track usage, save conversations, manage API keys). JWT (JSON Web Tokens) is the standard approach for API-based auth:

\`\`\`mermaid
sequenceDiagram
    participant C as Client
    participant S as Server
    participant DB as Database
    C->>S: POST /auth/signup {email, password}
    S->>DB: Store hashed password
    S-->>C: 201 Created
    C->>S: POST /auth/login {email, password}
    S->>DB: Verify password hash
    S-->>C: 200 OK + JWT token
    Note over C: Store token (httpOnly cookie or memory)
    C->>S: GET /api/chats (Authorization: Bearer <token>)
    S->>S: Verify JWT signature
    S->>DB: Fetch user's chats
    S-->>C: 200 OK + chats
\`\`\`

**Server-side auth middleware:**

\`\`\`javascript
import jwt from 'jsonwebtoken';
import bcrypt from 'bcryptjs';

// Registration
app.post('/auth/signup', async (req, res) => {
  const { email, password } = req.body;
  const hashed = await bcrypt.hash(password, 12);
  const user = await User.create({ email, password: hashed });
  res.status(201).json({ id: user._id });
});

// Login
app.post('/auth/login', async (req, res) => {
  const { email, password } = req.body;
  const user = await User.findOne({ email });
  if (!user || !(await bcrypt.compare(password, user.password))) {
    return res.status(401).json({ error: 'Invalid credentials' });
  }
  const token = jwt.sign({ userId: user._id }, process.env.JWT_SECRET, {
    expiresIn: '7d'
  });
  res.json({ token });
});

// Auth middleware — protect routes
function requireAuth(req, res, next) {
  const token = req.headers.authorization?.split(' ')[1];
  if (!token) return res.status(401).json({ error: 'No token' });
  try {
    req.user = jwt.verify(token, process.env.JWT_SECRET);
    next();
  } catch {
    res.status(401).json({ error: 'Invalid token' });
  }
}

// Protected route
app.get('/api/chats', requireAuth, async (req, res) => {
  const chats = await Chat.find({ userId: req.user.userId });
  res.json(chats);
});
\`\`\`

⚠️ **Gotcha:** Never store passwords in plain text. Always hash with bcrypt (cost factor 12+). And never store JWTs in \`localStorage\` — it's accessible to any XSS attack. Use \`httpOnly\` cookies or keep the token in memory (React state).

## 🧠 Deployment

Your app needs to run somewhere that isn't your laptop. The modern deployment stack:

\`\`\`mermaid
flowchart LR
    GH[GitHub<br/>Push to main] -->|trigger| CI[CI/CD<br/>Build & Test]
    CI -->|deploy| FE[Vercel/Netlify<br/>Frontend]
    CI -->|deploy| BE[Railway/Render<br/>Backend + DB]
    BE --> MONGO[MongoDB Atlas<br/>Cloud Database]
    BE --> LLM[LLM APIs<br/>OpenAI/Anthropic]
\`\`\`

**Frontend deployment (Vercel):**
\`\`\`bash
# Install Vercel CLI
npm i -g vercel

# Deploy from the client directory
cd client
vercel

# Set environment variables in Vercel dashboard
# REACT_APP_API_URL=https://your-backend.railway.app
\`\`\`

**Backend deployment (Railway / Render):**
1. Connect your GitHub repo
2. Set the root directory to \`server/\`
3. Set environment variables (MongoDB URI, API keys, JWT secret)
4. Railway auto-detects Node.js and runs \`npm start\`

**MongoDB Atlas** — managed MongoDB in the cloud. Free tier gives you 512MB, which is enough for thousands of conversations.

### The Deployment Checklist

Before you deploy, verify:
- [ ] \`.env\` is in \`.gitignore\`
- [ ] All secrets are set as environment variables in the hosting platform
- [ ] CORS is configured to allow only your frontend domain
- [ ] Error responses don't leak internal details (stack traces, DB queries)
- [ ] Rate limiting is enabled on API routes
- [ ] Health check endpoint exists (\`GET /health\` → 200 OK)

## ⌨️ Do This — Deploy the Prompt Playground

Take the Prompt Playground from module ai-03 and deploy it:
1. Set up MongoDB Atlas (free tier)
2. Deploy the Express backend to Railway or Render
3. Deploy the React frontend to Vercel
4. Configure CORS so the frontend can call the backend
5. Set environment variables in both platforms
6. Test the full flow: sign up, log in, send a prompt, see the response

## 🛠️ Mini-Project

Build and deploy a "Link Saver" app: users sign up, save URLs with tags, and can search their saved links. The backend stores links in MongoDB and uses the OpenAI API to auto-generate a one-sentence summary of each saved link. Include:
- JWT auth with signup/login
- CRUD endpoints for links
- A React UI with a dashboard showing saved links grouped by tag
- Deployed to Vercel (frontend) + Railway (backend) + Atlas (DB)

This is a small but complete production app. If you can build and deploy this, you have the foundation for every AI app that follows.

## ✅ You've mastered this when…

- You can structure a MERN project so it's navigable and maintainable
- You've implemented JWT auth end-to-end (signup, login, protected routes)
- You know the security basics: hashed passwords, httpOnly cookies, CORS, no leaked secrets
- You've deployed a full-stack app to the cloud and it works for someone who isn't you
- You understand the flow: push to GitHub → CI builds → deploys to hosting → serves users
`},
{id:'ai-05',num:'05',title:'Automation',hours:10,phase:1,topics:['APIs','Webhooks','Cron','Workflows'],content:`
## 🎯 Goal
Automate repetitive workflows by connecting APIs, webhooks, and scheduled tasks. This is the bridge between "I built a web app" and "I built a system that works while I sleep." Every AI agent you'll build later is fundamentally an automation — an LLM orchestrating API calls on your behalf.

## 🧠 APIs — The Glue of Modern Software

An API (Application Programming Interface) is a contract: "Send me this, I'll give you that." You've already used the OpenAI API. Now learn to work with any API systematically.

\`\`\`mermaid
flowchart TD
    YOUR[Your App] -->|REST/HTTP| API1[Stripe API<br/>Payments]
    YOUR -->|REST/HTTP| API2[Twilio API<br/>SMS]
    YOUR -->|REST/HTTP| API3[GitHub API<br/>Repos & Issues]
    YOUR -->|REST/HTTP| API4[OpenAI API<br/>LLM completions]
    YOUR -->|Webhook| WH[Incoming events<br/>from any service]
\`\`\`

### Reading API Docs — The Skill Nobody Teaches

Every API has the same anatomy:
1. **Base URL** — \`https://api.stripe.com/v1\`
2. **Authentication** — API key, OAuth token, or bearer token
3. **Endpoints** — \`POST /charges\`, \`GET /customers/{id}\`
4. **Request format** — headers, query params, JSON body
5. **Response format** — JSON with status codes
6. **Rate limits** — how many requests per minute/hour

**Pattern for calling any API:**

\`\`\`javascript
async function callAPI(endpoint, data) {
  const res = await fetch(\\\`https://api.example.com\\\${endpoint}\\\`, {
    method: 'POST',
    headers: {
      'Authorization': \\\`Bearer \\\${process.env.API_KEY}\\\`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(data)
  });

  if (res.status === 429) {
    // Rate limited — wait and retry
    const retryAfter = res.headers.get('Retry-After') || 5;
    await new Promise(r => setTimeout(r, retryAfter * 1000));
    return callAPI(endpoint, data);  // Retry
  }

  if (!res.ok) throw new Error(\\\`API error: \\\${res.status}\\\`);
  return res.json();
}
\`\`\`

## 🧠 Webhooks — Events That Come to You

APIs are pull-based: you ask for data. Webhooks are push-based: services call YOUR endpoint when something happens.

\`\`\`mermaid
sequenceDiagram
    participant S as Stripe
    participant Y as Your Server
    participant DB as Database
    Note over S: Customer pays $49
    S->>Y: POST /webhooks/stripe<br/>{"event": "payment_success", ...}
    Y->>Y: Verify webhook signature
    Y->>DB: Update subscription status
    Y-->>S: 200 OK (acknowledge)
\`\`\`

**Setting up a webhook receiver:**

\`\`\`javascript
app.post('/webhooks/stripe', express.raw({ type: 'application/json' }), (req, res) => {
  const sig = req.headers['stripe-signature'];

  try {
    // Verify the webhook is actually from Stripe
    const event = stripe.webhooks.constructEvent(req.body, sig, process.env.STRIPE_WEBHOOK_SECRET);

    switch (event.type) {
      case 'payment_intent.succeeded':
        handlePaymentSuccess(event.data.object);
        break;
      case 'customer.subscription.deleted':
        handleCancellation(event.data.object);
        break;
    }

    res.json({ received: true });
  } catch (err) {
    res.status(400).send(\\\`Webhook Error: \\\${err.message}\\\`);
  }
});
\`\`\`

⚠️ **Gotcha:** Always verify webhook signatures. Without verification, anyone can POST fake events to your endpoint and trigger actions (like granting premium access).

## 🧠 Scheduled Tasks (Cron)

Cron jobs run code on a schedule. Use cases: daily report generation, periodic data cleanup, scheduled AI analysis.

**Cron expression syntax:**

\`\`\`
┌─ minute (0-59)
│ ┌─ hour (0-23)
│ │ ┌─ day of month (1-31)
│ │ │ ┌─ month (1-12)
│ │ │ │ ┌─ day of week (0-7, 0=Sun)
│ │ │ │ │
* * * * *
\`\`\`

| Expression | Runs |
|-----------|------|
| \`0 9 * * 1-5\` | 9 AM, weekdays |
| \`*/15 * * * *\` | Every 15 minutes |
| \`0 0 1 * *\` | Midnight, 1st of each month |
| \`30 18 * * 5\` | 6:30 PM every Friday |

**Node.js cron with node-cron:**

\`\`\`javascript
import cron from 'node-cron';

// Every day at 8 AM — summarize yesterday's support tickets
cron.schedule('0 8 * * *', async () => {
  const tickets = await getYesterdaysTickets();
  const summary = await openai.chat.completions.create({
    model: 'gpt-4',
    messages: [{
      role: 'user',
      content: \\\`Summarize these support tickets: \\\${JSON.stringify(tickets)}\\\`
    }]
  });
  await sendSlackMessage('#support', summary.choices[0].message.content);
});
\`\`\`

## 🧠 Building Workflows — Chaining It All Together

Real automation chains multiple steps. Here's a workflow pattern:

\`\`\`mermaid
flowchart TD
    T[Trigger:<br/>New GitHub Issue] -->|Webhook| S1[Step 1:<br/>Classify with LLM]
    S1 -->|bug| S2A[Assign to eng team]
    S1 -->|feature request| S2B[Add to roadmap board]
    S1 -->|question| S2C[Auto-reply with docs link]
    S2A --> S3[Step 3:<br/>Notify Slack channel]
    S2B --> S3
    S2C --> S3
\`\`\`

This pattern — trigger → classify → route → act → notify — is the skeleton of every AI automation.

## ⌨️ Do This — Connect Three APIs

1. Get API keys for GitHub, a weather API (OpenWeatherMap, free), and OpenAI
2. Write a script that: fetches your GitHub repos, gets the weather in your city, asks the LLM to write a "morning briefing" combining both
3. Schedule it to run every morning using node-cron

## 🛠️ Mini-Project

Build a "GitHub Issue Triage Bot":
- Set up a webhook that triggers when a new issue is created on a repo you own
- Your Express server receives the webhook, sends the issue title and body to an LLM
- The LLM classifies it as bug / feature / question / docs
- Your bot uses the GitHub API to add the appropriate label to the issue
- Log all classifications to MongoDB for later analysis

Deploy it and test it by creating real issues on a test repo.

## ✅ You've mastered this when…

- You can read any API's documentation and write a working integration in under 30 minutes
- You understand the webhook flow: register → receive → verify → process → acknowledge
- You can write cron expressions from memory for common schedules
- You've built a multi-step automation that chains API calls with decision logic
- You understand retry logic and rate limit handling
`},
{id:'ai-06',num:'06',title:'AI Foundations',hours:14,phase:1,topics:['LLMs','Prompting','Embeddings','RAG','Vector DBs'],content:`
## 🎯 Goal
Understand how LLMs actually work (conceptually, not mathematically — that comes in Track B), master prompt engineering, and build your first RAG pipeline. This module is the foundation everything else in the AI track rests on.

## 🧠 What Is an LLM?

A Large Language Model is a neural network trained on vast amounts of text that predicts the next token in a sequence. That's it. Everything else — chatbots, code generation, reasoning — emerges from this single capability scaled up.

\`\`\`mermaid
flowchart LR
    I[Input tokens<br/>'The capital of France is'] --> M[LLM<br/>Transformer with<br/>billions of parameters]
    M --> O[Output token<br/>'Paris']
    O --> M
    M --> O2[Output token<br/>'is']
    O2 --> M
    M --> O3[...]
\`\`\`

**Key concepts:**

**Tokens** — LLMs don't read words; they read tokens. "unhappiness" might be ["un", "happiness"]. A token is roughly ¾ of a word in English. Why it matters: you're billed per token, and context windows are measured in tokens.

**Context window** — the maximum number of tokens the model can process at once. GPT-4 Turbo has 128K tokens. Claude has 200K. This is your working memory for any single call.

**Temperature** — controls randomness. 0 = deterministic (pick the highest-probability token every time). 1 = creative (sample from the distribution). For most AI applications, use 0–0.3. For creative writing, use 0.7–1.0.

### The API Pattern

Every LLM API follows the same shape:

\`\`\`javascript
const response = await openai.chat.completions.create({
  model: 'gpt-4',
  temperature: 0.2,
  messages: [
    { role: 'system', content: 'You are a helpful assistant.' },
    { role: 'user', content: 'Explain DNS in one sentence.' }
  ]
});

console.log(response.choices[0].message.content);
// "DNS translates human-readable domain names into IP addresses..."
\`\`\`

**The three roles:**
- **system** — sets behavior, personality, constraints. Processed first, carries weight.
- **user** — the human's input.
- **assistant** — the model's previous responses (for multi-turn conversations).

## 🧠 Prompt Engineering

Prompt engineering is the difference between "the AI gave a vague answer" and "the AI gave exactly what I needed." It's not magic — it's communication.

### The Prompt Stack

\`\`\`mermaid
flowchart TD
