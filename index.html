## 🎯 Goal

Ship a **production-grade AI assistant** that combines everything you've learned — from web fundamentals to transformers. This is the capstone: one project that proves you can design, build, deploy, evaluate, and maintain an AI system end to end.

## 🧠 Concept

### The Capstone Architecture

Your assistant isn't a toy — it's a system with real users, real data, and real failure modes. The architecture integrates every major concept from the track.

\`\`\`

### Phase 1: Define Your Assistant's Domain

Pick a specific domain and scope. An assistant that does everything does nothing well. Examples:

**Developer docs assistant** — indexes a project's documentation, answers questions with source citations, can search GitHub issues, and explains code. *Concrete scope:* ingest 50+ Markdown docs, support "how do I...?" and "where is...?" queries, cite file paths in every answer, tool to search GitHub Issues via API, refuse to generate code that isn't in the docs.

**Research assistant** — ingests papers and articles, summarizes findings, compares arguments across sources. *Concrete scope:* upload PDFs and URLs, chunk at section level, support "compare paper A vs paper B on topic X" queries, tool to fetch arXiv abstracts by ID, refuse to fabricate citations.

**Operations assistant** — connects to monitoring tools, answers "why is the API slow?", suggests fixes based on runbooks, creates incident tickets. *Concrete scope:* tool to query a Prometheus endpoint for the last hour of metrics, tool to search a runbook folder, tool to create a GitHub Issue labeled "incident", refuse to restart services or run destructive commands.

Whatever you choose, write a one-page **design doc** before coding. It should specify: **(1)** 5 example user queries your assistant must answer correctly (these become your first eval cases), **(2)** every tool with its name, input schema, and expected output, **(3)** 3 things the assistant must refuse (these become your safety evals), **(4)** the target user persona and how they access it (Slack bot, web UI, CLI).

### Phase 2: Build the Core

\`\`\`typescript
// Project structure
// capstone/
// ├── docker-compose.yml
// ├── Dockerfile
// ├── src/
// │   ├── server.ts         — Express app + routes
// │   ├── agent/
// │   │   ├── loop.ts       — ReAct agent loop
// │   │   ├── tools.ts      — tool definitions
// │   │   ├── prompts.ts    — system prompt + templates
// │   │   └── state.ts      — conversation state management
// │   ├── rag/
// │   │   ├── ingest.ts     — document chunking + indexing
// │   │   ├── retrieve.ts   — hybrid search + re-ranking
// │   │   └── pipeline.ts   — end-to-end RAG chain
// │   ├── auth/
// │   │   └── oauth.ts      — Google/GitHub OAuth
// │   ├── security/
// │   │   ├── input.ts      — input validation + injection detection
// │   │   └── output.ts     — output filtering
// │   └── observability/
// │       └── langfuse.ts   — tracing + scoring
// ├── eval/
// │   ├── dataset.json      — 50+ eval cases
// │   ├── harness.ts        — eval runner
// │   └── run.ts            — CLI entry point
// ├── tests/
// │   ├── tools.test.ts
// │   ├── rag.test.ts
// │   └── agent.test.ts
// └── .github/workflows/
//     └── ci.yml            — lint, type-check, test, eval

\`\`\`

### Phase 3: Make It Production-Worthy

The difference between a demo and a product:

**Conversation memory** — store conversations in MongoDB, load history on reconnect, implement sliding window + summarization for long conversations (module 07).

**Streaming responses** — users shouldn't stare at a loading spinner. Stream tokens as they're generated.

\`\`\`typescript
// Server-sent events for streaming
app.get("/api/chat/stream", async (req, res) => {
  res.setHeader("Content-Type", "text/event-stream");
  res.setHeader("Cache-Control", "no-cache");
  res.setHeader("Connection", "keep-alive");

  const stream = await agent.streamResponse(req.query.message as string);

  for await (const chunk of stream) {
    res.write(\\\`data: \\\${JSON.stringify({ token: chunk })}\\n\\n\\\`);
  }
  res.write("data: [DONE]\\n\\n");
  res.end();
});

\`\`\`

**Error handling** — LLM APIs fail, rate limits hit, tools timeout. Every external call needs retry logic with exponential backoff. Never show a raw stack trace to users.

**Rate limiting** — protect your API keys and infrastructure from abuse.

\`\`\`typescript
import rateLimit from "express-rate-limit";

const chatLimiter = rateLimit({
  windowMs: 60 * 1000,   // 1 minute
  max: 20,                // 20 messages per minute per user
  keyGenerator: (req) => req.user?.id || req.ip,
  message: { error: "Too many messages. Please wait a moment." }
});

app.use("/api/chat", chatLimiter);

\`\`\`

### Phase 4: Evaluate and Iterate

Your eval suite (module 12) is the project's heartbeat. Run it before every deploy. Track scores over time. Add cases from real user failures. The metrics that matter:

**Retrieval accuracy** — does the RAG pipeline find the right documents? **Answer quality** — LLM-judge score on correctness and completeness. **Safety** — does it refuse injection attempts? **Latency** — time to first token under load. **Tool accuracy** — does the agent use the right tools with correct arguments?

### Phase 5: Deploy and Monitor

\`\`\`yaml
# docker-compose.prod.yml
version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports: ["3000:3000"]
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=\\\${OPENAI_API_KEY}
      - LANGFUSE_SECRET_KEY=\\\${LANGFUSE_SECRET_KEY}
      - MONGODB_URI=mongodb://mongo:27017/assistant
      - CHROMA_URL=http://chroma:8000
    depends_on:
      mongo: { condition: service_healthy }
      chroma: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]

  chroma:
    image: chromadb/chroma:latest
    volumes: [chroma-data:/chroma/chroma]

volumes:
  mongo-data:
  chroma-data:

\`\`\`

After deployment, monitor with Langfuse (module 10): trace every request, track latency distributions, review low-scoring conversations, set up alerts when eval scores drop.

## ⌨️ Do This

1. Define your assistant's domain, scope, user persona, and 3-5 tools it will have
2. Build the project structure in TypeScript with the agent loop, RAG pipeline, and tool system
3. Implement OAuth, input/output security, and conversation memory
4. Add streaming responses and error handling with retry logic
5. Write 50+ eval cases and wire the harness into CI
6. Dockerize everything and deploy to a cloud provider
7. Monitor for a week: review Langfuse traces, add eval cases from real conversations, iterate

## ⚠️ Gotcha

**Scope creep is the capstone killer.** You'll want to add more tools, more features, better UI. Resist. Ship a focused v1 that does 3 things well, with proper eval and monitoring, rather than a sprawling prototype that does 10 things poorly. The goal is demonstrating production-quality engineering — not maximizing feature count. You can iterate after v1 ships.

## 🛠️ The Deliverable

A deployed, working AI assistant. Acceptance criteria (all must pass for capstone sign-off):

| Area | Requirement |
|---|---|
| **Codebase** | TypeScript, strict mode, zero \\\`any\\\` types in agent/RAG code |
| **Auth** | OAuth login (Google or GitHub); unauthenticated requests return 401 |
| **Agent** | ReAct loop with 3+ tools; each tool has typed input/output schemas |
| **RAG** | Hybrid search (keyword + vector) with re-ranking; every answer cites a source chunk |
| **Security** | Input filter catches prompt injection; output filter blocks PII leak; red-team eval passes |
| **Eval** | 50+ cases in \\\`eval/dataset.json\\\`; harness runs in CI; deploy blocked if accuracy < threshold |
| **Observability** | Langfuse trace on every request; dashboard shows p50/p95 latency and quality score |
| **Deployment** | \\\`docker compose up\\\` launches the full stack; health check endpoint returns 200 |
| **Streaming** | First token appears within 1s of user submit; tokens stream via SSE |
| **Docs** | README covers architecture diagram, setup steps, design decisions, and known limitations |

This is your portfolio piece -- the project that proves you can build production AI systems, not just call an API.

## ✅ Mastery Checklist

- You've designed an AI system with clear scope, defined tools, and user personas
- The codebase is TypeScript with proper types for messages, tools, state, and API responses
- Authentication works (OAuth) and security layers catch injection attempts
- The RAG pipeline uses hybrid search + re-ranking on real data
- Conversation memory persists across sessions with history summarization
- Responses stream to the client (SSE or WebSockets)
- 50+ eval cases run in CI and block deploys when scores drop
- Langfuse traces every request with latency and quality metrics
- The full stack runs with \`docker compose up\` and deploys to a cloud provider
- You can explain every architectural decision and the tradeoffs you made

function getCompleted() {
  try { return JSON.parse(localStorage.getItem('witbyte-completed') || '{}'); } catch(e) { return {}; }
}
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;font-size:13px;z-index:200;box-shadow:0 4px 12px var(--shadow);opacity:0;transition:opacity .3s';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.style.opacity = '1');
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}
function setCompleted(modId, done) {
  const c = getCompleted();
  if (done) c[modId] = Date.now(); else delete c[modId];
  try { localStorage.setItem('witbyte-completed', JSON.stringify(c)); return true; } catch(e) { showToast('Storage full — completion not saved'); return false; }
}
function isCompleted(modId) { return !!getCompleted()[modId]; }
function getTrackProgress(trackKey) {
  const mods = ALL_MODULES[trackKey] || [];
  const completed = getCompleted();
  const done = mods.filter(m => completed[m.id]).length;
  return { done, total: mods.length, pct: mods.length ? Math.round(done/mods.length*100) : 0 };
}
function getOverallProgress() {
  let done = 0, total = 0;
  const completed = getCompleted();
  for (const mods of Object.values(ALL_MODULES)) { total += mods.length; done += mods.filter(m => completed[m.id]).length; }
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}

function getAdjacentModules(trackKey, modId) {
  const mods = ALL_MODULES[trackKey] || [];
  const idx = mods.findIndex(m => m.id === modId);
  return { prev: idx > 0 ? mods[idx-1] : null, next: idx < mods.length-1 ? mods[idx+1] : null };
}

// ── Copy code ──
function copyCode(btn) {
  const pre = btn.closest('.code-wrap').querySelector('pre');

    btn.classList.add('copied');
    const toast = btn.nextElementSibling;
    if (toast) toast.classList.add('show');
    setTimeout(() => { btn.classList.remove('copied'); if (toast) toast.classList.remove('show'); }, 1500);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();

}

function renderModule(trackKey, mod) {
  const track = TRACKS[trackKey];
  const main = document.getElementById('main');
  const adj = getAdjacentModules(trackKey, mod.id);
  const done = isCompleted(mod.id);

  // Build prev/next nav
  let navHtml = '<div class="mod-nav">';
  if (adj.prev) {
    navHtml += `<div class="mod-nav-btn" role="button" tabindex="0" onclick="showModule('${trackKey}','${adj.prev.id}')" onkeydown="kbClick(event)">
      <span class="nav-dir">← Previous</span>
      <span class="nav-title">${adj.prev.title}</span>
    </div>`;
  }
  if (adj.next) {
    navHtml += `<div class="mod-nav-btn next" role="button" tabindex="0" onclick="showModule('${trackKey}','${adj.next.id}')" onkeydown="kbClick(event)">
      <span class="nav-dir">Next →</span>
      <span class="nav-title">${adj.next.title}</span>
    </div>`;
  } else {
    navHtml += `<div class="mod-nav-btn next track-done">
      <span class="nav-dir">Track complete</span>
      <span class="nav-title">You've finished ${track.name}</span>
    </div>`;
  }
  navHtml += '</div>';

  // Build complete bar
  const completeHtml = `<div class="complete-bar">
    <button class="complete-toggle ${done?'done':''}" onclick="toggleComplete('${mod.id}')">
      <span class="check-icon">${done ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}</span>
      <span class="complete-text">${done ? 'Completed' : 'Mark as complete'}</span>
    </button>
    <span class="complete-label">${done ? 'Nice work!' : 'Finished this module? Track your progress.'}</span>
  </div>`;

  if (!mod.content) {
    main.innerHTML = `<div class="reader">
      <div class="back-btn" role="button" tabindex="0" onclick="showTrack('${trackKey}')" onkeydown="kbClick(event)">← ${track.name}</div>
      <div class="mod-eyebrow" style="color:var(--${track.color})"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--${track.color})"></span> ${track.name} · Module ${mod.num}</div>
      <h1>${mod.title}</h1>
      <div class="mod-meta"><span>~${mod.hours} hours</span></div>
      <p style="margin-top:32px;color:var(--ink2)">Content coming soon — this module is being ported from the existing curriculum.</p>
      ${mod.topics ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:16px">${mod.topics.map(t=>`<span style="font-size:12px;padding:3px 10px;border-radius:6px;background:var(--${track.color}-soft);color:var(--${track.color});font-weight:500">${t}</span>`).join('')}</div>` : ''}
      ${completeHtml}
      ${navHtml}
    </div>`;
    main.scrollTop = 0;
    return;
  }

  // Parse markdown content
  const content = parseMarkdown(mod.content);

  // Word count and reading time
  const wordCount = mod.content.replace(/[#*`\n|>-]/g,' ').split(/\s+/).filter(w=>w).length;
  const readTime = Math.max(1, Math.ceil(wordCount / 200));

  main.innerHTML = `<div class="reader">
    <div class="back-btn" role="button" tabindex="0" onclick="showTrack('${trackKey}')" onkeydown="kbClick(event)">← ${track.name}</div>
    <div class="mod-eyebrow" style="color:var(--${track.color})"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--${track.color})"></span> ${track.name} · Module ${mod.num}</div>
    <h1>${mod.title}</h1>
    <div class="mod-meta"><span>~${mod.hours} hours</span><span>${readTime} min read</span>${mod.topics ? `<span>${mod.topics.length} topics</span>` : ''}</div>
    <div class="module-content">${content}</div>
    ${completeHtml}
    ${navHtml}
  </div>`;
  main.scrollTop = 0;

  // Wrap code blocks with copy button
  setTimeout(() => {
    document.querySelectorAll('.reader pre').forEach(pre => {
      if (pre.closest('.mermaid-wrap') || pre.classList.contains('mermaid')) return;
      if (pre.parentElement.classList.contains('code-wrap')) return;
      const wrap = document.createElement('div');
      wrap.className = 'code-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      wrap.insertAdjacentHTML('beforeend', `
        <button class="copy-btn" onclick="copyCode(this)" aria-label="Copy code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <span class="copy-toast">Copied!</span>
      `);
    });
  }, 60);

  // Render mermaid diagrams
  setTimeout(async () => {
    const sources = document.querySelectorAll('.mermaid-source');
    if (!sources.length) return;
    sources.forEach(el => {
      const src = el.textContent;
      const div = document.createElement('div');
      div.className = 'mermaid-wrap';
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.setAttribute('data-source', src);
      pre.textContent = src;
      div.appendChild(pre);
      el.replaceWith(div);
    });
    try {
      await mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
    } catch(e) { console.warn('Mermaid render error:', e); }
  }, 50);
}

// ── Simple Markdown Parser ──
function parseMarkdown(md) {
  let html = '';
  const lines = md.split('\n');
  let i = 0;
  let inCodeBlock = false;
  let codeContent = '';
  let codeLang = '';
  let inTable = false;
  let tableRows = [];
  let inList = false;
  let listItems = [];
  let listType = 'ul';

  function flushList() {
    if (inList && listItems.length) {
      const cls = listItems[0].startsWith('- [ ]') || listItems[0].startsWith('- [x]') ? ' class="checklist"' : '';
      html += `<${listType}${cls}>${listItems.map(li => {
        let text = li.replace(/^[-*]\s*(\[.\]\s*)?/, '').replace(/^\d+\.\s*/, '');
        return `<li>${inlineFormat(text)}</li>`;
      }).join('')}</${listType}>`;
      listItems = [];
      inList = false;
    }
  }

  function flushTable() {
    if (inTable && tableRows.length) {
      let t = '<div style="overflow-x:auto"><table>';
      tableRows.forEach((row, ri) => {
        if (ri === 1 && row.match(/^[\s|:-]+$/)) return;
        const tag = ri === 0 ? 'th' : 'td';
        const cells = row.split('|').filter(c => c.trim() !== '');
        t += '<tr>' + cells.map(c => `<${tag}>${inlineFormat(c.trim())}</${tag}>`).join('') + '</tr>';
      });
      t += '</table></div>';
      html += t;
      tableRows = [];
      inTable = false;
    }
  }

  function inlineFormat(text) {
    return text
      .replace(/\\`/g, '\x00BT\x00')
      .replace(/`([^`]+)`/g, (_, c) => '<code>' + escapeHtml(c) + '</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\x00BT\x00/g, '`');
  }

  while (i < lines.length) {
    const line = lines[i];

    // Code blocks
    if (line.match(/^```/)) {
      if (inCodeBlock) {
        if (codeLang === 'mermaid') {
          html += `<div class="mermaid-source" style="display:none">${codeContent}</div>`;
        } else {
          html += `<pre><code>${escapeHtml(codeContent)}</code></pre>`;
        }
        inCodeBlock = false;
        codeContent = '';
        codeLang = '';
      } else {
        flushList();
        flushTable();
        inCodeBlock = true;
        codeLang = line.replace(/^```/, '').trim();
      }
      i++;
      continue;
    }
    if (inCodeBlock) {
      codeContent += (codeContent ? '\n' : '') + line;
      i++;
      continue;
    }

    // Empty line
    if (line.trim() === '') {
      flushList();
      flushTable();
      i++;
      continue;
    }

    // Table
    if (line.includes('|') && line.trim().startsWith('|')) {
      flushList();
      if (!inTable) inTable = true;
      tableRows.push(line);
      i++;
      continue;
    } else {
      flushTable();
    }

    // Headers
    const hMatch = line.match(/^(#{1,3})\s+(.*)/);
    if (hMatch) {
      flushList();
      const level = hMatch[1].length;
      const tag = `h${level}`;
      html += `<${tag}>${inlineFormat(hMatch[2])}</${tag}>`;
      i++;
      continue;
    }

    // Lists
    if (line.match(/^\s*[-*]\s/) || line.match(/^\s*\d+\.\s/)) {
      if (!inList) {
        inList = true;
        listType = line.match(/^\s*\d+\./) ? 'ol' : 'ul';
      }
      listItems.push(line.trim());
      i++;
      continue;
    } else {
      flushList();
    }

    // Blockquote
    if (line.startsWith('>')) {
      html += `<blockquote>${inlineFormat(line.replace(/^>\s*/, ''))}</blockquote>`;
      i++;
      continue;
    }

    // Gotcha callout
    if (line.match(/^⚠️\s*\*\*Gotcha/)) {
      const gotchaText = line.replace(/^⚠️\s*\*\*Gotcha:?\*\*\s*/, '');
      html += `<div class="gotcha-box"><div class="gotcha-title">⚠ Gotcha</div><div class="gotcha-body">${inlineFormat(gotchaText)}</div></div>`;
      i++;
      continue;
    }

    // Paragraph
    html += `<p>${inlineFormat(line)}</p>`;
    i++;
  }
  if (inCodeBlock) {
    html += `<pre><code>${escapeHtml(codeContent)}</code></pre>`;
  }
  flushList();
  flushTable();
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Search ──
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let _searchTimer;

searchInput.addEventListener('input', () => {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(_doSearch, 150);
});
function _doSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) { searchResults.classList.remove('show'); searchInput.setAttribute('aria-expanded','false'); return; }

  const results = [];
  for (const entry of SEARCH_INDEX) {
    if (entry.haystack.includes(q)) {
      let snippet = '';
      if (entry.mod.content) {
        const idx = entry.mod.content.toLowerCase().indexOf(q);
        if (idx > -1) {
          const start = Math.max(0, idx - 40);
          const end = Math.min(entry.mod.content.length, idx + q.length + 60);
          snippet = '...' + entry.mod.content.substring(start, end).replace(/[#*`\n]/g,' ').trim() + '...';
        }
      }
      results.push({ trackKey: entry.trackKey, track: entry.track, mod: entry.mod, snippet });
    }
  }

  if (results.length === 0) {
    searchResults.innerHTML = '<div style="padding:14px;color:var(--ink3);font-size:13px">No results found</div>';
  } else {
    searchResults.innerHTML = results.slice(0,8).map(r => `
      <div class="sr-item" role="option" onclick="showModule('${r.trackKey}','${r.mod.id}');searchResults.classList.remove('show');searchInput.value='';">
        <div class="sr-track" style="color:var(--${r.track.color})">${escapeHtml(r.track.name)} · ${r.mod.num}</div>
        <div class="sr-title">${escapeHtml(r.mod.title)}</div>
        ${r.snippet ? `<div class="sr-snippet">${escapeHtml(r.snippet)}</div>` : ''}
      </div>
    `).join('');
  }
  searchResults.classList.add('show');
  searchInput.setAttribute('aria-expanded','true');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) { searchResults.classList.remove('show'); searchInput.setAttribute('aria-expanded','false'); }
});

// ── Theme toggle ──
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const isDark = current !== 'light';
  const newTheme = isDark ? 'light' : 'dark';
  root.setAttribute('data-theme', newTheme);
  try { localStorage.setItem('witbyte-theme', newTheme); } catch(e) {}

  // Swap icon: moon (dark mode) ↔ sun (light mode)
  const icon = document.getElementById('themeIcon');
  if (icon) {
    icon.innerHTML = isDark
      ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }

  // Re-initialize mermaid for new theme
  mermaid.initialize({
    startOnLoad: false,
    theme: isDark ? 'default' : 'dark',
    themeVariables: isDark ? {} : {
      darkMode: true,
      primaryColor: '#7c3aed',
      primaryTextColor: '#e6e4ea',
      primaryBorderColor: '#3e3c44',
      lineColor: '#6b6873',
      secondaryColor: '#1e1833',
      tertiaryColor: '#18171b',
      fontFamily: "'DM Sans', system-ui, sans-serif",
      fontSize: '13px'
    }
  });
  // Re-render any visible mermaid diagrams with new theme
  const mermaidEls = document.querySelectorAll('.mermaid[data-source]');
  if (mermaidEls.length) {
    mermaidEls.forEach(el => {
      el.removeAttribute('data-processed');
      el.innerHTML = '';
      el.textContent = el.getAttribute('data-source');
    });
    mermaid.run({ nodes: mermaidEls }).catch(() => {});
  }
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  // Ignore when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;

  // Left/Right arrows: prev/next module navigation
  if (currentView === 'module' && currentTrack && currentModule) {
    const adj = getAdjacentModules(currentTrack, currentModule);
    if (e.key === 'ArrowLeft' && adj.prev) { e.preventDefault(); showModule(currentTrack, adj.prev.id); return; }
    if (e.key === 'ArrowRight' && adj.next) { e.preventDefault(); showModule(currentTrack, adj.next.id); return; }
  }

  // Escape: go up one level (module → track overview → home)
  if (e.key === 'Escape') {
    if (currentView === 'module' && currentTrack) { e.preventDefault(); showTrack(currentTrack); return; }
    if (currentView === 'track') { e.preventDefault(); showHome(); return; }
  }

  // Cmd/Ctrl+K or /: focus search
  if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key === 'k')) {
    e.preventDefault();
    const si = document.getElementById('searchInput');
    if (si) { si.focus(); si.select(); }
    if (currentView !== 'home') showHome();
    return;
  }
});

// Show/hide keyboard hint based on view
function updateKbdHint() {
  const hint = document.getElementById('kbd-hint');
  if (!hint) return;
  if (currentView === 'module') {
    hint.style.display = 'block';
    hint.innerHTML = '<kbd>←</kbd><kbd>→</kbd> navigate &nbsp; <kbd>Esc</kbd> back';
  } else if (currentView === 'track') {
    hint.style.display = 'block';
    hint.innerHTML = '<kbd>Esc</kbd> home';
  } else {
    hint.style.display = 'none';
  }
}
// Patch show functions to update hint
const _origShowHome = showHome, _origShowTrack = showTrack, _origShowModule = showModule;
showHome = function() { _origShowHome(); updateKbdHint(); };
showTrack = function(k) { _origShowTrack(k); updateKbdHint(); };
showModule = function(tk, mi) { _origShowModule(tk, mi); updateKbdHint(); };

// ── Init ──
renderSidebar();
renderHome();
</script>
